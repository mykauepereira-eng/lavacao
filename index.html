<title>Lavação Móvel</title><style>/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {
	cursor: crosshair;
	}
.leaflet-popup-pane,
.leaflet-control {
	cursor: auto;
	}
.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {
	cursor: move;
	cursor: -webkit-grabbing;
	cursor:    -moz-grabbing;
	cursor:         grabbing;
	}

/* marker & overlays interactivity */
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}

/* visual tweaks */

.leaflet-container {
	background: #ddd;
	outline-offset: 1px;
	}
.leaflet-container a {
	color: #0078A8;
	}
.leaflet-zoom-box {
	border: 2px dotted #38f;
	background: rgba(255,255,255,0.5);
	}


/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;
	border-bottom: 1px solid #ccc;
	width: 26px;
	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;
	color: black;

/* Base styles for the element that has a tooltip */
.leaflet-tooltip {

	padding: 6px;

	}
.leaflet-tooltip-top:before,
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	position: absolute;
	pointer-events: none;
	border: 6px solid transparent;
	background: transparent;
	content: "";
	}

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {
	left: 50%;
	margin-left: -6px;
	}
.leaflet-tooltip-top:before {
	bottom: 0;
	margin-bottom: -12px;
	border-top-color: #fff;
	}
.leaflet-tooltip-bottom:before {
	top: 0;
	margin-top: -12px;
	margin-left: -6px;
	border-bottom-color: #fff;
	}
.leaflet-tooltip-left {
	margin-left: -6px;
}
.leaflet-tooltip-right {
	margin-left: 6px;
}
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {

.leaflet-tooltip-left:before {

	}
.leaflet-tooltip-right:before {

	border-right-color: #fff;
	}

.row{display:flex;gap:8px;align-items:center}.row.wrap{flex-wrap:wrap}.row>.btn{flex:1}.sp{flex:1}

.chips{display:flex;flex-wrap:wrap;gap:8px}.chips.nw{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}.chips.nw::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line2);background:var(--sf);border-radius:999px;padding:8px 14px;font-weight:650;font-size:14px;cursor:pointer;white-space:nowrap;transition:all .18s var(--ease);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--sf);border-color:var(--ink)}.chip small{opacity:.7;font-weight:600}
.seg{display:flex;background:var(--sf2);border:1px solid var(--line);border-radius:13px;padding:3px;gap:2px}.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px 6px;font-weight:700;font-size:13.5px;color:var(--mut);cursor:pointer;transition:all .2s}.seg button.on{background:var(--sf);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:750;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-agendado{color:var(--s-agendado);background:color-mix(in srgb,var(--s-agendado) 13%,transparent)}.st-confirmado{color:var(--s-confirmado);background:color-mix(in srgb,var(--s-confirmado) 13%,transparent)}.st-caminho{color:var(--s-caminho);background:color-mix(in srgb,var(--s-caminho) 13%,transparent)}.st-andamento{color:var(--s-andamento);background:color-mix(in srgb,var(--s-andamento) 15%,transparent)}.st-concluido{color:var(--s-concluido);background:color-mix(in srgb,var(--s-concluido) 13%,transparent)}.st-cancelado{color:var(--s-cancelado);background:color-mix(in srgb,var(--s-cancelado) 15%,transparent)}.st-faltou{color:var(--s-faltou);background:color-mix(in srgb,var(--s-faltou) 12%,transparent)}
.st-andamento::before,.st-caminho::before{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3;transform:scale(.7)}}
.tag{display:inline-block;padding:2px 8px;border-radius:7px;font-size:12px;font-weight:700;background:var(--sf2);color:var(--mut);border:1px solid var(--line)}
/* ---------- formulários ---------- */
label.f{display:block;margin:0 0 12px}label.f>span{display:block;font-size:13px;font-weight:700;color:var(--mut);margin:0 0 6px}
input,select,textarea{width:100%;min-height:48px;border:1px solid var(--line2);border-radius:13px;background:var(--sf);padding:11px 13px;outline:0;transition:border-color .2s,box-shadow .2s;font-size:16px}
textarea{min-height:84px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 4px var(--pris)}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--pri)}input.bad{border-color:var(--bad)}
.inl{display:grid;grid-template-columns:1fr 1fr;gap:10px}.inl3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chk{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}.chk:last-child{border-bottom:0}.chk span{flex:1}
.sw{position:relative;width:50px;height:30px;flex:none;border-radius:20px;background:var(--line2);transition:background .2s;border:0;cursor:pointer}.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .25s var(--spring)}.sw.on{background:var(--pri)}.sw.on::after{transform:translateX(20px)}
.err{color:var(--bad);font-size:14px;font-weight:600;min-height:0;margin:4px 0 8px}.err:empty{display:none}
.search{position:relative}.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--mut)}.search input{padding-left:42px}
/* ---------- listas ---------- */
.li{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--sf);border:1px solid var(--line);margin-bottom:8px;cursor:pointer;transition:transform .15s var(--ease),background .2s;width:100%;text-align:left}
.li:active{transform:scale(.99);background:var(--sf2)}.li .tx{flex:1;min-width:0}.li .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.li .tx small{display:block;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.li .end{text-align:right;flex:none}
.av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;color:#fff;background:linear-gradient(135deg,#14b8a6,#2563eb)}
.av.s{width:34px;height:34px;border-radius:11px;font-size:13px}
/* ---------- linha do tempo ---------- */
.tl{position:relative;margin:4px 0 6px}
.tli{display:grid;grid-template-columns:58px 1fr;gap:10px;position:relative}
.tli .tm{text-align:right;padding-top:14px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}.tli .tm small{display:block;color:var(--mut);font-weight:650;font-size:11.5px}
.tli .bd{position:relative;padding-left:18px;padding-bottom:10px}
.tli .bd::before{content:"";position:absolute;left:4px;top:0;bottom:0;width:2px;background:var(--line2)}
.tli:first-child .bd::before{top:18px}.tli:last-child .bd::before{bottom:calc(100% - 18px)}
.tli .bd>i{position:absolute;left:-1px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--sf);border:3px solid var(--s-agendado);z-index:1}
.tli .card{margin:0;padding:12px 14px;cursor:pointer}
.tli.done .card{opacity:.62}.tli.now .card{border-color:var(--pri);box-shadow:0 0 0 3px var(--pris),var(--sh)}
.gap{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut);padding:6px 0 10px;font-weight:600}.gap svg{width:15px;height:15px}
.free{display:flex;align-items:center;gap:8px;width:100%;border:1.5px dashed var(--line2);background:none;border-radius:14px;padding:10px 12px;color:var(--pri);font-weight:700;font-size:14px;cursor:pointer;margin-bottom:10px}
/* ---------- semana ---------- */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:4px 0 14px}
.wk button{border:1px solid var(--line);background:var(--sf);border-radius:15px;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;transition:all .2s var(--ease);min-width:0}
.wk button small{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase}.wk button b{font-size:18px}.wk button em{font-style:normal;font-size:10.5px;color:var(--mut);height:14px}
.wk button .dots{display:flex;gap:2px;height:6px}.wk button .dots i{width:5px;height:5px;border-radius:50%;background:var(--pri)}
.wk button.on{background:var(--ink);border-color:var(--ink);color:var(--sf)}.wk button.on small,.wk button.on em{color:inherit;opacity:.75}.wk button.on .dots i{background:var(--sf)}
.wk button.hj b{color:var(--pri)}.wk button.on.hj b{color:inherit}.wk button.off{opacity:.55}
.wkh{display:flex;align-items:center;gap:8px;margin-top:6px}
/* ---------- próximo atendimento ---------- */
.next{border:0;background:var(--sf);position:relative;overflow:hidden}
.next::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--grad)}
.eta{display:flex;align-items:baseline;gap:8px;margin:10px 0 2px}.eta b{font-size:30px;font-weight:850;letter-spacing:-.03em}.eta span{color:var(--mut);font-weight:650}
.src{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--mut)}.src i{width:8px;height:8px;border-radius:50%;background:var(--mut)}.src.gps i{background:var(--ok);box-shadow:0 0 0 0 rgba(21,128,61,.5);animation:gp 1.8s infinite}
@keyframes gp{70%{box-shadow:0 0 0 7px rgba(21,128,61,0)}}
.timer{font-size:34px;font-weight:850;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
/* ---------- mapa / rota ---------- */
.mapw{position:relative;border-radius:22px;overflow:hidden;box-shadow:var(--sh);border:1px solid var(--line);height:46vh;min-height:280px;margin-bottom:14px;background:var(--sf2)}
#map{position:absolute;inset:0}
.mapc{position:absolute;right:10px;top:10px;z-index:500;display:flex;flex-direction:column;gap:8px}
.mapc .icb{box-shadow:var(--sh)}
.mk{width:32px;height:32px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;box-shadow:0 4px 10px rgba(0,0,0,.35);border:2px solid #fff}
.mk span{transform:rotate(45deg)}.mkb{width:30px;height:30px;border-radius:10px;background:var(--ink);color:var(--sf);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.35)}.mkb svg{width:17px;height:17px}
.me{width:18px;height:18px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 0 rgba(37,99,235,.5);animation:mep 2s infinite}
@keyframes mep{70%{box-shadow:0 0 0 14px rgba(37,99,235,0)}100%{box-shadow:0 0 0 0 rgba(37,99,235,0)}}
.leaflet-container{font:inherit;background:var(--sf2)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .leaflet-tile-pane{filter:invert(.92) hue-rotate(180deg) brightness(.95) contrast(.9)}}
:root[data-theme=dark] .leaflet-tile-pane{filter:invert(.92) hue-rotate(180deg) brightness(.95) contrast(.9)}
.aut{margin-top:8px}.aut .bar{height:9px}
.stop{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:16px;background:var(--sf);border:1px solid var(--line);margin-bottom:8px}
.stop .n{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;flex:none}
.stop .tx{flex:1;min-width:0}.stop .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stop .tx small{color:var(--mut);font-size:12.5px}
.stop .mv{display:flex;flex-direction:column;gap:2px}.stop .mv button{width:30px;height:22px;border:1px solid var(--line);background:var(--sf2);border-radius:7px;cursor:pointer;display:grid;place-items:center;padding:0}.stop .mv svg{width:14px;height:14px}
.late{color:var(--bad);font-weight:750}
/* ---------- folha (bottom sheet) ---------- */
#sheet{position:fixed;inset:0;z-index:60;pointer-events:none}
#sheet.on{pointer-events:auto}
.shbd{position:absolute;inset:0;background:rgba(5,12,18,.45);opacity:0;transition:opacity .28s}
#sheet.on .shbd{opacity:1}
.shp{position:absolute;left:0;right:0;bottom:0;max-height:92dvh;overflow:auto;overscroll-behavior:contain;background:var(--bg);border-radius:26px 26px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .42s var(--spring);box-shadow:var(--sh2)}
#sheet.on .shp{transform:none}
.shp .grab{width:42px;height:5px;border-radius:5px;background:var(--line2);margin:4px auto 10px}
.shh{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px;position:sticky;top:-8px;background:var(--bg);padding:6px 0 8px;z-index:2}.shh .tx{flex:1;min-width:0}.shh h2{font-size:21px}.shh small{color:var(--mut);font-size:13.5px}
@media(min-width:700px){.shp{left:50%;right:auto;width:620px;transform:translate(-50%,105%);bottom:16px;border-radius:26px;max-height:88dvh}#sheet.on .shp{transform:translate(-50%,0)}}
.steps{display:flex;gap:4px;margin:6px 0 14px}.steps i{flex:1;height:5px;border-radius:5px;background:var(--line2);transition:background .3s}.steps i.on{background:var(--pri)}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.photos img,.photos .add{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;border:1px solid var(--line)}.photos .add{display:grid;place-items:center;background:var(--sf2);cursor:pointer;color:var(--mut)}
.pay{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pay button{border:1.5px solid var(--line2);background:var(--sf);border-radius:14px;padding:12px 4px;font-weight:750;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px}.pay button.on{border-color:var(--pri);background:var(--pris);color:var(--pri)}
.qty{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.qty:last-child{border-bottom:0}.qty .tx{flex:1;min-width:0}.qty input{width:96px;min-height:40px;text-align:right}
.done-ill{width:74px;height:74px;border-radius:24px;margin:8px auto 12px;display:grid;place-items:center;background:var(--oks);color:var(--ok);animation:pop .5s var(--spring)}.done-ill svg{width:38px;height:38px}

.marg{display:flex;align-items:center;gap:10px;margin-top:10px}.marg .bar{flex:1}
.stick{position:sticky;top:76px}
@media(min-width:900px){.cols{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;align-items:start}.cols>*{min-width:0}}

.toast{pointer-events:auto;background:var(--ink);color:var(--sf);border-radius:15px;padding:12px 14px;font-weight:650;box-shadow:var(--sh2);display:flex;align-items:center;gap:10px;animation:tin .35s var(--spring)}
.toast.bad{background:var(--bad);color:#fff}.toast button{margin-left:auto;border:0;background:rgba(255,255,255,.18);color:inherit;border-radius:10px;padding:6px 10px;font-weight:800;cursor:pointer}

.wxi-sun{color:#f59e0b}.wxi-sunc{color:#f59e0b}.wxi-cloud{color:#94a3b8}.wxi-fog{color:#94a3b8}.wxi-rain{color:#3b82f6}.wxi-storm{color:#7c3aed}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(#fff calc(var(--p)*1%),rgba(255,255,255,.25) 0);display:grid;place-items:center;flex:none}.ring b{width:50px;height:50px;border-radius:50%;background:rgba(14,60,110,.35);display:grid;place-items:center;font-size:14px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}.menu button{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border-radius:20px;border:1px solid var(--line);background:var(--sf);box-shadow:var(--sh);cursor:pointer;text-align:left;font-weight:750}.menu button i{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--pris);color:var(--pri)}.menu button small{font-weight:600;color:var(--mut);font-size:12.5px}
details.card>summary{cursor:pointer;font-weight:750;list-style:none;display:flex;align-items:center;gap:8px}details.card>summary::-webkit-details-marker{display:none}details.card>summary::after{content:"›";margin-left:auto;transform:rotate(90deg);transition:transform .2s;color:var(--mut);font-size:20px}details.card[open]>summary::after{transform:rotate(-90deg)}details.card[open]>summary{margin-bottom:12px}
.learn p{margin:0 0 10px;color:var(--ink2)}.learn code{background:var(--sf2);padding:1px 6px;border-radius:6px;font-size:13.5px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const MSG0={

const ST_AG={agendado:'Agendado',confirmado:'Confirmado',caminho:'A caminho',andamento:'Em andamento',concluido:'Concluído',cancelado:'Cancelado',faltou:'Cliente ausente'};
const ATIVO=['agendado','confirmado','caminho','andamento'];

const PGN={pix:'Pix',dinheiro:'Dinheiro',cartao:'Cartão',fiado:'Fiado'};

// ---------- datas (sempre no horário local) ----------
const D={
 iso:t=>{const d=new Date(t);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())},
 add:(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return D.iso(d)},
 dow:iso=>new Date(iso+'T12:00:00').getDay(),
 m:hm=>{const[h,m]=String(hm||'0:0').split(':').map(Number);return h*60+(m||0)},
 hm:min=>{min=Math.round(min);return p2(Math.floor(min/60)%24)+':'+p2(min%60)},
 ts:(iso,hm)=>new Date(iso+'T'+(hm||'00:00')+':00').getTime(),
 tsm:(iso,min)=>D.ts(iso,'00:00')+Math.round(min)*6e4,
 hhmm:ts=>{const d=new Date(ts);return p2(d.getHours())+':'+p2(d.getMinutes())},
 diff:(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5),
 okIso:v=>/^\d{4}-\d{2}-\d{2}$/.test(v||'')&&!isNaN(new Date(v+'T12:00:00')),
 okHm:v=>/^([01]\d|2[0-3]):[0-5]\d$/.test(v||'')
};

// ---------- geografia ----------
const Geo={
 ok:p=>!!p&&Number.isFinite(p.lat)&&Number.isFinite(p.lng)&&Math.abs(p.lat)<=90&&Math.abs(p.lng)<=180&&!(p.lat===0&&p.lng===0),
 hav(a,b){const r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dg=r(b.lng-a.lng),h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;return 2*6371*Math.asin(Math.min(1,Math.sqrt(h)))},
 // estimativa sem internet: linha reta × fator de ruas, na velocidade média informada
 est(a,b,cfg){const km=Geo.hav(a,b)*(cfg.fator||1.35);return{km,min:km/(cfg.vel||25)*60,est:true}},
 // aceita link do Google Maps, "lat, lng" ou link com q=/ll=
 parse(t){t=String(t||'');const pats=[/@(-?\d+\.\d+),\s*(-?\d+\.\d+)/,/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/,/[?&](?:q|ll|query|destination|daddr)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/i,/^\s*(-?\d{1,2}\.\d{2,})\s*[,;\s]\s*(-?\d{1,3}\.\d{2,})\s*$/];
  for(const p of pats){const m=t.match(p);if(m){const o={lat:+m[1],lng:+m[2]};if(Geo.ok(o))return o}}return null}
};

// ---------- planejamento do dia: horários de chegada em cadeia ----------
const Plan={
 // janela de início permitida para uma parada (em ms)
 win(s,iso,J){if(s.hora){const t=D.ts(iso,s.hora);return[t,t]}const a=D.m(J.ini),al=D.m(J.alm||'12:00'),ae=al+(+J.almMin||0),b=D.m(J.fim);
  const w=s.jan==='manha'?[a,al]:s.jan==='tarde'?[ae,b]:[a,b];return[D.tsm(iso,w[0]),D.tsm(iso,w[1])]},
 // t0: saída (ms); legs[i]: trecho até a parada i {km,min}; devolve chegada, início, fim, espera e atraso de cada parada
 chain(t0,stops,legs,cfg,iso){const J=cfg.jor,aj=(cfg.ajt||100)/100,fimJ=D.ts(iso,J.fim);let t=t0,km=0,atr=0,esp=0;
  const out=stops.map((s,i)=>{const L=legs[i]||{km:0,min:0},mv=L.min*aj,chega=t+mv*6e4,[w0,w1]=Plan.win(s,iso,J),ini=Math.max(chega,w0),atraso=Math.max(0,ini-w1)/6e4,espera=(ini-chega)/6e4,fim=ini+(s.dur||60)*6e4;
   km+=L.km;atr+=atraso;esp+=espera;t=fim+(cfg.folga||0)*6e4;return{id:s.id,km:L.km,min:mv,est:!!L.est,chega,ini,fim,espera,atraso,fora:fim>fimJ}});
  return{stops:out,km,fim:t,atraso:atr,espera:esp,t0}},
 cost(c){return c.atraso*100+(c.fim-c.t0)/6e4+c.km*0.5},
 // melhor ordem: testa todas as ordens até 8 paradas; acima disso, vizinho mais próximo + 2-opt
 // M(i,j): trecho entre pontos (0 = saída, 1..n = paradas)
 opt(stops,M,t0,cfg,iso){const n=stops.length;if(n<2)return{order:stops.map(s=>s.id),chain:Plan.chain(t0,stops,stops.map((s,i)=>M(0,i+1)),cfg,iso)};
  const ev=p=>{const st=p.map(i=>stops[i]),lg=p.map((x,k)=>M(k?p[k-1]+1:0,x+1)),c=Plan.chain(t0,st,lg,cfg,iso);return{c,v:Plan.cost(c)}};
  let best=null,bp=null;const take=p=>{const r=ev(p);if(!best||r.v<best.v-1e-9){best=r;bp=p.slice()}};
  const idx=[...Array(n).keys()];
  if(n<=8){const a=idx.slice(),c=Array(n).fill(0);take(a);let i=0;while(i<n){if(c[i]<i){const k=i%2?c[i]:0;[a[k],a[i]]=[a[i],a[k]];take(a);c[i]++;i=0}else{c[i]=0;i++}}}
  else{const left=new Set(idx),p=[];let cur=0;while(left.size){let b=null,bv=1e18;left.forEach(j=>{const v=M(cur,j+1).min;if(v<bv){bv=v;b=j}});p.push(b);left.delete(b);cur=b+1}
   take(p);let imp=true,g=0;while(imp&&g++<50){imp=false;for(let i=0;i<n-1;i++)for(let k=i+1;k<n;k++){const q=bp.slice(0,i).concat(bp.slice(i,k+1).reverse(),bp.slice(k+1));const r=ev(q);if(r.v<best.v-1e-9){best=r;bp=q;imp=true}}}}
  return{order:bp.map(i=>stops[i].id),chain:best.c}},
 // horários livres do dia (considera jornada, almoço e agendamentos com hora marcada)
 livres(S,iso,need,now){const J=S.cfg.jor;if(!(J.dias||[]).includes(D.dow(iso)))return[];
  const viag=20,fol=S.cfg.folga||0,al=D.m(J.alm||'12:00'),ae=al+(+J.almMin||0);
  let W=(+J.almMin>0?[[D.m(J.ini),al],[ae,D.m(J.fim)]]:[[D.m(J.ini),D.m(J.fim)]]);
  if(now&&D.iso(now)===iso){const nm=Math.ceil(D.mins(now)/5)*5;W=W.map(([a,b])=>[Math.max(a,nm),b]).filter(([a,b])=>b>a)}
  const busy=S.ag.filter(a=>a.data===iso&&ATIVO.includes(a.st)&&a.hora).map(a=>[D.m(a.hora)-viag,D.m(a.hora)+(a.dur||60)+fol]).sort((x,y)=>x[0]-y[0]);
  const out=[];W.forEach(([a,b])=>{let s=a;busy.forEach(([x,y])=>{if(y<=s||x>=b)return;if(x>s)out.push([s,x]);s=Math.max(s,y)});if(b>s)out.push([s,b])});
  return out.filter(([a,b])=>b-a>=need).map(([a,b])=>({de:D.hm(a),ate:D.hm(b),min:b-a}))}
};
D.mins=ts=>{const d=new Date(ts);return d.getHours()*60+d.getMinutes()+d.getSeconds()/60};

const Ag={

  const hora=String(f.hora||'').trim();if(hora&&!D.okHm(hora))return err('Hora inválida (use 09:30).');
  const v=S.serv.find(x=>x.id===f.sid);if(!v)return err('Escolha o serviço.');
  if(f.cat&&!CATS.some(k=>k[0]===f.cat))return err('Tipo de carro inválido.');
  const vid=f.vid&&(c.vei||[]).some(x=>x.id===f.vid)?f.vid:'';
  const ve=vid?(c.vei||[]).find(x=>x.id===vid):null,cat=ve?ve.cat:(f.cat||'');
  const dur=f.dur==null||String(f.dur).trim()===''?(v.dur||60):num(f.dur);if(!(dur>=10&&dur<=600))return err('Duração entre 10 e 600 minutos.');

  if(preco!==null&&!(preco>=0))return err('Preço inválido.');if(taxa!==null&&!(taxa>=0))return err('Taxa inválida.');
  const rec=f.rec==null||f.rec===''?0:num(f.rec);if(!(Number.isInteger(rec)&&rec>=0&&rec<=180))return err('Repetição inválida.');
  const jan=hora?'fixa':(['manha','tarde','livre'].includes(f.jan)?f.jan:'livre');
  const add=(f.add||[]).filter(a=>(S.cfg.add||[]).some(x=>x.id===a));
  const pos=f.pos&&Geo.ok(f.pos)?{lat:+f.pos.lat,lng:+f.pos.lng}:null;

function load(){try{const r=Store.load(localStorage);if(r.rec)BOOT.msg='Os dados estavam danificados; restauramos a cópia de '+r.from.slice(SNAP.length)+'.';else if(r.bad){BOOT.msg='Os dados salvos estavam danificados e não havia cópia. O original foi guardado à parte.';try{localStorage.setItem('lavacao-corrompido',localStorage.getItem(KEY))}catch(e){}}return r.s}catch(e){return Core.empty()}}
let S=load();
const ui={v:'hoje',d:null,sh:null,f:{},arm:'',anim:1,cq:'',cf:'todos',per:'hoje',et:'est',plan:{},q:''};
const hoje=()=>D.iso(Date.now());ui.d=hoje();
function snapNow(){try{Store.snap(localStorage,S,hoje());snapT=Date.now()}catch(e){}}
function save(){const r=Store.save(localStorage,S);if(!r.ok){toast(r.e,false);return false}if(Date.now()-snapT>120000)snapNow();RT.dirty();return true}
addEventListener('pagehide',snapNow);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')snapNow()});

// ---------- utilidades ----------
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const R0=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const N=(n,d=1)=>(+n||0).toLocaleString('pt-BR',{maximumFractionDigits:d});
const KM=n=>n==null?'—':N(n,n<10?1:0)+' km';
const MIN=m=>{m=Math.round(m||0);return m<60?m+' min':Math.floor(m/60)+' h'+(m%60?' '+String(m%60).padStart(2,'0'):'')};
const ini=n=>String(n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const first=n=>String(n||'').trim().split(/\s+/)[0];
const catN=c=>(CATS.find(k=>k[0]===c)||['',''])[1];
const cliOf=id=>S.cli.find(c=>c.id===id);
const servOf=id=>S.serv.find(v=>v.id===id);
const carOf=a=>{const c=cliOf(a.cid),v=c&&(c.vei||[]).find(x=>x.id===a.vid);return v?v.mod+(v.placa?' · '+v.placa:''):a.cat?catN(a.cat):''};
const carShort=a=>{const c=cliOf(a.cid),v=c&&(c.vei||[]).find(x=>x.id===a.vid);return v?v.mod:a.cat?catN(a.cat).split(' /')[0]:'carro'};
const WD=['dom','seg','ter','qua','qui','sex','sáb'],WDL=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const dCurta=iso=>{const d=new Date(iso+'T12:00:00');return WD[d.getDay()]+', '+d.getDate()+'/'+String(d.getMonth()+1).padStart(2,'0')};
const dLonga=iso=>{const s=new Date(iso+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});return s[0].toUpperCase()+s.slice(1)};
const quando=iso=>{const n=D.diff(hoje(),iso);return n===0?'hoje':n===1?'amanhã':n===-1?'ontem':n>1&&n<7?WDL[D.dow(iso)]+(D.dow(iso)%6?'-feira':''):dCurta(iso)};
const ago=t=>{const d=D.diff(D.iso(t),hoje());return d===0?'hoje':d===1?'ontem':d<30?'há '+d+' dias':d<365?'há '+Math.round(d/30)+(Math.round(d/30)===1?' mês':' meses'):'há mais de um ano'};
const vib=()=>{try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}};
function toast(m,ok=true,act){const w=$('toasts'),t=document.createElement('div');t.className='toast'+(ok?'':' bad');t.setAttribute('role','status');t.innerHTML=`<span>${esc(m)}</span>`;
 if(act){const b=document.createElement('button');b.textContent=act[0];b.onclick=()=>{act[1]();t.remove()};t.appendChild(b)}
 w.appendChild(t);setTimeout(()=>t.classList.add('out'),act?5200:2800);setTimeout(()=>t.remove(),act?5600:3200)}
function twice(k,fn){if(ui.arm===k){ui.arm='';fn()}else{ui.arm=k;draw();setTimeout(()=>{if(ui.arm===k){ui.arm='';draw()}},4000)}}
const armed=(k,a,b)=>ui.arm===k?b:a;
function done(r,msg,o={}){if(!r||!r.ok){toast((r&&r.e)||'Não foi possível salvar.',false);return false}if(msg)Core.log(S,msg,Date.now());save();if(msg)toast(msg,true,o.undo);vib();if(!o.keep)draw();return true}

// ---------- navegação ----------
const VIEWS={hoje:{t:'Hoje',tab:'hoje'},agenda:{t:'Agenda',tab:'agenda'},rota:{t:'Rota',tab:'rota',wide:1},cli:{t:'Clientes',tab:'cli'},mais:{t:'Mais',tab:'mais'},
 calc:{t:'Calculadora',tab:'mais',back:1},caixa:{t:'Caixa',tab:'mais',back:1},est:{t:'Estoque',tab:'mais',back:1},serv:{t:'Serviços e preços',tab:'mais',back:1},ajustes:{t:'Ajustes',tab:'mais',back:1}};
const TABS=[['hoje','Hoje','home'],['agenda','Agenda','cal'],['rota','Rota','route'],['cli','Clientes','users'],['mais','Mais','grid']];
function go(v,o={}){if(!VIEWS[v])v='hoje';if(location.hash!=='#/'+v)history.pushState(null,'','#/'+v);ui.v=v;ui.anim=1;ui.arm='';if(!o.keep)scrollTo(0,0);draw()}
function goBack(){if(history.length>1)history.back();else go('mais')}
addEventListener('popstate',()=>{if(ui.popIgnore){ui.popIgnore=false;return}if(ui.sh){closeSheet(true);return}const v=(location.hash.match(/^#\/(\w+)/)||[])[1];ui.v=VIEWS[v]?v:'hoje';ui.anim=1;draw()});

// ---------- desenho ----------
function headHtml(){const V=VIEWS[ui.v],sub=ui.v==='hoje'?dLonga(hoje()):ui.v==='agenda'?dLonga(ui.d):'';
 const right=ui.v==='hoje'?wxChip(hoje()):ui.v==='agenda'?`<button class="icb" onclick="ui.d=hoje();draw()" aria-label="Voltar para hoje">${ico('cal')}</button>`:ui.v==='rota'?`<button class="icb" onclick="RT.plan(ui.rd||hoje(),{force:1}).then(()=>draw())" aria-label="Recalcular">${ico('refresh')}</button>`:'';
 return `${V.back?`<button class="back" onclick="goBack()" aria-label="Voltar">${ico('left')}</button>`:''}<div class="tt">${sub?`<small>${esc(sub)}</small>`:''}<h1>${ui.v==='hoje'?saud():V.t}</h1></div>${right}`}
const saud=()=>{const h=new Date().getHours();return(h<12?'Bom dia':h<18?'Boa tarde':'Boa noite')+(S.cfg.nome?', '+esc(first(S.cfg.nome)):'')};
function tabsHtml(){const n=Ag.dia(S,hoje()).filter(a=>ATIVO.includes(a.st)).length;
 return TABS.map(([k,t,i])=>`<button class="${VIEWS[ui.v].tab===k?'on':''}" onclick="go('${k}')" aria-label="${t}">${ico(i)}<span>${t}</span>${k==='hoje'&&n?`<b class="dot">${n}</b>`:''}</button>`).join('')}
function sideHtml(){const it=[...TABS.slice(0,4),['calc','Calculadora','calc'],['caixa','Caixa','wallet'],['est','Estoque','box'],['serv','Serviços e preços','tag'],['ajustes','Ajustes','gear']];
 return `<div class="brand"><span class="av s" style="background:var(--grad)">${ico('drop')}</span>${esc(S.marca||'Lavação')}</div>${it.map(([k,t,i],n)=>`${n===4?'<div class="sep"></div>':''}<button class="${ui.v===k?'on':''}" onclick="go('${k}')">${ico(i)}${t}</button>`).join('')}`}
const RENDER={};
function draw(){
 const m=$('main'),V=VIEWS[ui.v];
 $('top').innerHTML=headHtml();$('tabs').innerHTML=tabsHtml();$('side').innerHTML=sideHtml();
 let h='';try{h=RENDER[ui.v]()}catch(e){console.error(e);h=`<div class="card"><b>Não foi possível abrir esta tela.</b><p class="mut sm">${esc(e.message)}</p></div>`;oops(e.message)}
 m.className=(ui.anim?'enter':'')+(V.wide?' wide':'');ui.anim=0;m.innerHTML=h;
 const fab=$('fab'),showF=['hoje','agenda','cli'].includes(ui.v);fab.style.display=showF?'':'none';
 fab.innerHTML=ui.v==='cli'?`${ico('plus')}<span>Cliente</span>`:`${ico('plus')}<span>Agendar</span>`;fab.onclick=ui.v==='cli'?()=>openSheet('cli',{}):()=>openSheet('ag',{data:ui.v==='agenda'?ui.d:hoje()});
 document.title=V.t+' · '+(S.marca||'Lavação');
 if(typeof after==='function')after();
 requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('[data-w]').forEach(i=>i.style.width=Math.max(0,Math.min(100,+i.dataset.w))+'%')));
}
const AFTER={};function after(){(AFTER[ui.v]||(()=>{}))();if(ui.v!=='rota')MAP.park()}
addEventListener('scroll',()=>{const t=$('top');if(t)t.classList.toggle('sc',scrollY>4)},{passive:true});
function oops(m){ui.errs=(ui.errs||[]).concat([new Date().toLocaleTimeString('pt-BR')+' · '+m]).slice(-10)}
addEventListener('error',e=>oops(e.message||'erro'));

// ---------- folha inferior (formulários e detalhes) ----------
const SHEETS={};
function openSheet(t,o={}){const was=!!ui.sh;ui.sh={t,...o};ui.f=o.f||{};ui.onF=null;renderSheet();const s=$('sheet');requestAnimationFrame(()=>s.classList.add('on'));document.body.style.overflow='hidden';if(!was)history.pushState({sh:1},'',location.hash);
 setTimeout(()=>{const f=s.querySelector('[data-af]');if(f&&matchMedia('(min-width:700px)').matches)f.focus()},350)}
function renderSheet(){const s=$('sheet');if(!ui.sh){s.innerHTML='';return}let h='';try{h=SHEETS[ui.sh.t]()}catch(e){console.error(e);h=`<p class="bad">${esc(e.message)}</p>`;oops(e.message)}
 const keep=s.querySelector('.shp'),y=keep?keep.scrollTop:0;
 s.innerHTML=`<div class="shbd" onclick="closeSheet()"></div><div class="shp" role="dialog" aria-modal="true"><div class="grab"></div>${h}</div>`;
 const p=s.querySelector('.shp');if(p&&y)p.scrollTop=y;sheetSwipe(p);try{Fotos.paint();const af=SHEETS[ui.sh.t].after;if(af)af()}catch(e){}}
function closeSheet(fromPop){const s=$('sheet');if(!ui.sh)return;s.classList.remove('on');ui.sh=null;document.body.style.overflow='';setTimeout(()=>{if(!ui.sh)s.innerHTML=''},350);if(!fromPop&&history.state&&history.state.sh){ui.popIgnore=true;history.back()}draw()}
function sheetSwipe(p){if(!p)return;let y0=null,dy=0;p.addEventListener('touchstart',e=>{if(p.scrollTop<=0&&e.target.closest('.grab,.shh'))y0=e.touches[0].clientY;else y0=null},{passive:true});
 p.addEventListener('touchmove',e=>{if(y0==null)return;dy=Math.max(0,e.touches[0].clientY-y0);p.style.transition='none';p.style.transform=`translateY(${dy}px)`},{passive:true});
 p.addEventListener('touchend',()=>{if(y0==null)return;p.style.transition='';p.style.transform='';if(dy>110)closeSheet();y0=null;dy=0})}
const shHead=(t,sub,extra='')=>`<div class="shh"><div class="tx"><h2>${t}</h2>${sub?`<small>${sub}</small>`:''}</div>${extra}<button class="icb" onclick="closeSheet()" aria-label="Fechar">${ico('x')}</button></div>`;
function setF(k,v,re){ui.f[k]=v;if(re)renderSheet();else if(ui.onF)ui.onF(k)}
const shErr=m=>{const e=$('sherr');if(e)e.textContent=m||'';else if(m)toast(m,false);return false};

// ---------- contato e navegação externa ----------
function abrir(url){let w=null;try{w=window.open(url,'_blank')}catch(e){}if(w){try{w.opener=null}catch(e){}}else location.href=url}
function wa(tel,txt){abrir(Msg.wa(tel,txt))}

// Tudo aqui é opcional: sem internet o app continua funcionando com estimativas.
const Net={

 async j(url,ms=9000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{signal:c.signal,headers:{Accept:'application/json'}});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}},

 cset(k,v){Net.mem[k]={t:Date.now(),v};const ks=Object.keys(Net.mem);if(ks.length>80)delete Net.mem[ks[0]];return v},

 async route(pts){if(pts.length<2||!Net.on())return null;const k='r'+pts.map(Net.key).join(';'),c=Net.cget(k,20*6e4);if(c)return c;
  try{const j=await Net.j('https://router.project-osrm.org/route/v1/driving/'+Net.ll(pts)+'?overview=full&geometries=geojson&steps=false');if(j.code!=='Ok'||!j.routes||!j.routes[0])return null;
   const r=j.routes[0];return Net.cset(k,{legs:r.legs.map(l=>({km:l.distance/1000,min:l.duration/60})),geo:r.geometry.coordinates.map(c=>[c[1],c[0]]),km:r.distance/1000,min:r.duration/60})}catch(e){return null}},
 // matriz de tempos entre todos os pontos (para escolher a melhor ordem)
 async table(pts){if(pts.length<2||pts.length>25||!Net.on())return null;const k='t'+pts.map(Net.key).join(';'),c=Net.cget(k,20*6e4);if(c)return c;
  try{const j=await Net.j('https://router.project-osrm.org/table/v1/driving/'+Net.ll(pts)+'?annotations=duration,distance');if(j.code!=='Ok')return null;return Net.cset(k,{min:j.durations.map(r=>r.map(x=>x==null?null:x/60)),km:j.distances.map(r=>r.map(x=>x==null?null:x/1000))})}catch(e){return null}},
 // endereço → coordenadas (Nominatim/OpenStreetMap), priorizando a região da base
 async geocode(q){q=String(q||'').trim();if(q.length<4||!Net.on())return[];const b=S.cfg.base,vb=b&&Geo.ok(b)?`&viewbox=${b.lng-.6},${b.lat+.6},${b.lng+.6},${b.lat-.6}`:'';
  try{const j=await Net.j('https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=br&limit=6&accept-language=pt-BR&addressdetails=1'+vb+'&q='+encodeURIComponent(q));
   return j.map(x=>({n:Net.nome(x),full:x.display_name,lat:+x.lat,lng:+x.lon})).filter(Geo.ok)}catch(e){return null}},
 async reverse(p){if(!Net.on())return null;try{const j=await Net.j(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&accept-language=pt-BR&lat=${p.lat}&lon=${p.lng}`);return j&&j.address?Net.nome(j):null}catch(e){return null}},
 nome(x){const a=x.address||{},r=[a.road||a.pedestrian||a.footway,a.house_number].filter(Boolean).join(', '),b=a.suburb||a.neighbourhood||a.quarter,c=a.city||a.town||a.village||a.municipality;return [r,b,c].filter(Boolean).join(' · ')||String(x.display_name||'').split(',').slice(0,3).join(',')}

const GPS={pos:null,acc:null,t:0,w:null,err:'',perm:'',subs:new Set(),last:null,

 on:()=>GPS.w!=null,

  GPS.w=navigator.geolocation.watchPosition(p=>{GPS.pos={lat:p.coords.latitude,lng:p.coords.longitude};GPS.acc=p.coords.accuracy;GPS.t=Date.now();GPS.err='';GPS.perm='granted';GPS.subs.forEach(f=>f())},
   e=>{GPS.err=e.code===1?'Permissão de localização negada. Libere nas configurações do navegador.':'Sem sinal de GPS no momento.';if(e.code===1){GPS.perm='denied';GPS.stop()}GPS.subs.forEach(f=>f())},
   {enableHighAccuracy:true,maximumAge:10000,timeout:30000})},
 stop(){if(GPS.w!=null&&navigator.geolocation)navigator.geolocation.clearWatch(GPS.w);GPS.w=null},
 once(){return new Promise((ok,no)=>{if(!navigator.geolocation)return no(new Error('Este aparelho não oferece GPS ao navegador.'));
  navigator.geolocation.getCurrentPosition(p=>{GPS.pos={lat:p.coords.latitude,lng:p.coords.longitude};GPS.acc=p.coords.accuracy;GPS.t=Date.now();GPS.perm='granted';ok(GPS.pos)},
   e=>no(new Error(e.code===1?'Permissão de localização negada. Libere nas configurações do navegador.':'Não foi possível pegar sua localização agora. Tente perto de uma janela ou na rua.')),{enableHighAccuracy:true,timeout:20000,maximumAge:5000})})},
 async check(){try{if(navigator.permissions){const r=await navigator.permissions.query({name:'geolocation'});GPS.perm=r.state;r.onchange=()=>{GPS.perm=r.state}}}catch(e){}return GPS.perm},
 label(){return GPS.err?GPS.err:GPS.fresh()?'GPS ativo'+(GPS.acc?' · precisão '+Math.round(GPS.acc)+' m':''):GPS.on()?'Procurando sinal…':'GPS desligado'}
};

// ---------- fotos (guardadas no banco do próprio navegador, IndexedDB) ----------
const Fotos={db:null,urls:{},
 open(){return Fotos.db?Promise.resolve(Fotos.db):new Promise((ok,no)=>{if(!window.indexedDB)return no(new Error('Sem banco de fotos neste navegador.'));const r=indexedDB.open('lavacao-fotos',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>{Fotos.db=r.result;ok(Fotos.db)};r.onerror=()=>no(r.error)})},
 tx(mode,fn){return Fotos.open().then(db=>new Promise((ok,no)=>{const t=db.transaction('f',mode),st=t.objectStore('f');let out;const q=fn(st);if(q)q.onsuccess=()=>{out=q.result};t.oncomplete=()=>ok(out);t.onerror=()=>no(t.error)}))},
 async put(blob){const id='f'+Date.now().toString(36)+Core.id();await Fotos.tx('readwrite',st=>st.put(blob,id));return id},
 get:id=>Fotos.tx('readonly',st=>st.get(id)),
 async del(id){if(Fotos.urls[id]){URL.revokeObjectURL(Fotos.urls[id]);delete Fotos.urls[id]}return Fotos.tx('readwrite',st=>st.delete(id))},
 count:()=>Fotos.tx('readonly',st=>st.count()).catch(()=>0),
 async url(id){if(Fotos.urls[id])return Fotos.urls[id];const b=await Fotos.get(id).catch(()=>null);return b?(Fotos.urls[id]=URL.createObjectURL(b)):null},
 paint(){document.querySelectorAll('img[data-foto]').forEach(async im=>{if(im.src)return;const u=await Fotos.url(im.dataset.foto);if(u)im.src=u;else im.alt='foto indisponível'})},
 shrink(file){return new Promise(ok=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>ok(b||file),'image/jpeg',.72)};img.onerror=()=>{URL.revokeObjectURL(u);ok(file)};img.src=u})}
};

// ---------- previsão do tempo (Open-Meteo, gratuito) ----------
const WX={d:null,
 async load(force){const b=S.cfg.base;if(!b||!Geo.ok(b))return null;
  try{const c=JSON.parse(localStorage.getItem('lav-wx')||'null');if(c&&Math.abs(c.lat-b.lat)<.05&&Math.abs(c.lng-b.lng)<.05){WX.d=c;if(!force&&Date.now()-c.t<3*36e5)return c}}catch(e){}
  if(!Net.on())return WX.d;
  try{const j=await Net.j(`https://api.open-meteo.com/v1/forecast?latitude=${b.lat.toFixed(3)}&longitude=${b.lng.toFixed(3)}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&hourly=precipitation_probability&timezone=auto&forecast_days=8`);
   const d={t:Date.now(),lat:b.lat,lng:b.lng,day:{},h:{}};j.daily.time.forEach((iso,i)=>d.day[iso]={c:j.daily.weather_code[i],mx:j.daily.temperature_2m_max[i],mn:j.daily.temperature_2m_min[i],p:j.daily.precipitation_probability_max[i]});
   (j.hourly.time||[]).forEach((t,i)=>{d.h[t.slice(0,13)]=j.hourly.precipitation_probability[i]});WX.d=d;try{localStorage.setItem('lav-wx',JSON.stringify(d))}catch(e){}return d}catch(e){return WX.d}},
 day:iso=>WX.d&&WX.d.day?WX.d.day[iso]||null:null,
 hora:(iso,hm)=>WX.d&&WX.d.h&&hm?WX.d.h[iso+'T'+hm.slice(0,2)]??null:null

function wxChip(iso){const w=WX.day(iso);if(!w)return S.cfg.base?'':`<button class="wx" onclick="go('ajustes')" title="Defina sua base para ver a previsão">${wxIco('sunc')}<span class="mut">Clima</span></button>`;

// ---------- planejador da rota do dia ----------
const RT={P:{},ver:0,busy:{},lastLive:null,
 dirty(){RT.ver++},
 ativos:iso=>Ag.dia(S,iso).filter(a=>ATIVO.includes(a.st)),
 base:()=>S.cfg.base&&Geo.ok(S.cfg.base)?S.cfg.base:null,
 startOf(iso,ags){const now=Date.now(),J=S.cfg.jor,b=RT.base(),g=GPS.fresh(),and=ags.find(a=>a.st==='andamento');
  if(iso===hoje()){if(and)return{pos:Ag.pos(S,and)||g||b,t0:and.ini||now,src:'and'};const t0=Math.max(now,D.ts(iso,J.ini));return g?{pos:g,t0,src:'gps'}:{pos:b,t0,src:b?'base':'nada'}}
  return{pos:b,t0:D.ts(iso,J.ini),src:b?'base':'nada'}},

  if(rest.some(a=>a.ord!=null))return[...fix,...rest.slice().sort((a,b)=>(a.ord??1e9)-(b.ord??1e9)||(a.hora||'99').localeCompare(b.hora||'99'))];
  if(!start.pos||rest.length<2)return[...fix,...rest];
  let i0=0,t0=start.t0;const sx=a=>({id:a.id,hora:a.hora,jan:a.jan,dur:a.dur});
  if(fix.length){const ix=fix.map(a=>ags.indexOf(a)+1),c=Plan.chain(start.t0,fix.map(sx),ix.map((x,k)=>M(k?ix[k-1]:0,x)),S.cfg,iso);t0=c.fim;i0=ix[ix.length-1]}
  const rx=rest.map(a=>ags.indexOf(a)+1),r=Plan.opt(rest.map(sx),(i,j)=>M(i?rx[i-1]:i0,rx[j-1]),t0,S.cfg,iso);
  return[...fix,...r.order.map(id=>rest.find(a=>a.id===id))]},
 stale(iso){const P=RT.P[iso],g=GPS.fresh();return !P||P.ver!==RT.ver||Date.now()-P.t>90000||(iso===hoje()&&g&&(!P.gp||Geo.hav(g,P.gp)>=0.3))},
 async ensure(iso){if(!RT.stale(iso)||RT.busy[iso])return false;RT.busy[iso]=1;try{await RT.plan(iso)}finally{RT.busy[iso]=0}return true},
 async plan(iso,o={}){const ags=RT.ativos(iso),g=GPS.fresh(),old=RT.P[iso];
  if(!o.force&&!o.opt&&!RT.stale(iso))return old;
  const start=RT.startOf(iso,ags),pts0=[start.pos,...ags.map(a=>Ag.pos(S,a))],valid=pts0.filter(Boolean);
  const tab=valid.length>2&&valid.length===pts0.length?await Net.table(pts0):null,M=RT.M(pts0,tab);
  let seq=RT.ordem(ags,start,M,iso);if(o.opt){const z=ags.map(a=>({...a,ord:null}));seq=RT.ordem(z,start,M,iso).map(x=>ags.find(a=>a.id===x.id))}
  const pts=[start.pos,...seq.map(a=>Ag.pos(S,a))],b=RT.base(),back=b&&seq.length?b:null,routePts=[...pts,back].filter(Boolean);
  const rr=routePts.length>1&&routePts.length===pts.length+(back?1:0)?await Net.route(routePts):null;
  let legs;if(rr)legs=rr.legs.slice(0,seq.length);else{const Mx=RT.M(pts,null);legs=seq.map((a,i)=>Mx(i,i+1))}
  const backLeg=back?(rr?rr.legs[seq.length]:(pts[pts.length-1]?Geo.est(pts[pts.length-1],back,S.cfg):null)):null;

  const P={iso,ag:seq,chain,legs,back:backLeg,geo:rr?rr.geo:null,start,net:!!rr,t:Date.now(),ver:RT.ver,gp:g,sem:seq.filter(a=>!Ag.pos(S,a)),
   kmTot:chain.km+(backLeg?backLeg.km:0),minTot:legs.reduce((x,l)=>x+(l.min||0),0)*(S.cfg.ajt||100)/100+(backLeg?backLeg.min*(S.cfg.ajt||100)/100:0)};if(!o.opt)RT.P[iso]=P;return P},
 // previsão de chegada ao próximo atendimento a partir do GPS (atualiza sozinha)
 async live(){const iso=hoje(),ags=RT.ativos(iso),nx=ags.find(a=>a.st==='caminho')||ags.find(a=>a.st!=='andamento');if(!nx)return null;const p=Ag.pos(S,nx),g=GPS.fresh();

function googleRota(){const P=RT.P[ui.rd||hoje()];if(!P)return;const pts=P.ag.map(a=>{const p=Ag.pos(S,a);return p?p.lat+','+p.lng:Ag.end(S,a)}).filter(Boolean);if(!pts.length)return toast('As paradas não têm localização.',false);
 const dst=pts.pop(),wp=pts.slice(0,9);abrir(`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(dst)}${wp.length?'&waypoints='+encodeURIComponent(wp.join('|')):''}&travelmode=driving`);if(P.ag.length>10)toast('O Google Maps aceita até 10 paradas por vez.',false)}

function kmCli(c){if(!c)return null;if(c.dist!=null&&Number.isFinite(c.dist))return c.dist;const b=RT.base();return b&&Geo.ok(c)?Math.round(Geo.est(b,c,S.cfg).km*10)/10:null}
async function kmRefine(c){const b=RT.base();if(!b||!Geo.ok(c)||(c.dist!=null&&!c.distAuto))return;const r=await Net.route([b,{lat:c.lat,lng:c.lng}]);if(r){c.dist=Math.round(r.km*10)/10;c.distAuto=1;save()}}
async function autoGeo(id){const c=cliOf(id);if(!c||Geo.ok(c)||!c.end)return;const L=await Net.geocode(c.end);if(L&&L.length){c.lat=L[0].lat;c.lng=L[0].lng;c.geo='auto';save();kmRefine(c);toast('Localização de '+first(c.n)+' encontrada pelo endereço (aproximada). Confira no cadastro.')}}
function setPos(alvo,id,p,src,nome){if(alvo==='base'){S.cfg.base={lat:p.lat,lng:p.lng,end:nome||(S.cfg.base&&S.cfg.base.end)||''};S.cli.forEach(c=>{if(c.distAuto){c.dist=null;c.distAuto=0}});save();WX.load(true).then(()=>draw());toast('Base definida');MAP.sig='';return}
 const c=cliOf(id);if(!c)return;c.lat=p.lat;c.lng=p.lng;c.geo=src;if(!c.end&&nome)c.end=nome;if(c.distAuto||c.dist==null){c.dist=null;c.distAuto=0}save();kmRefine(c);toast('Localização de '+first(c.n)+' salva')}
async function posGps(alvo,id){toast('Pegando sua localização…');try{const p=await GPS.once();const nome=await Net.reverse(p);setPos(alvo,id,p,'gps',nome);if(ui.sh)ui.sh.t==='geo'?closeSheet():renderSheet();draw()}catch(e){toast(e.message,false)}}

 h+=L.map(c=>{const st=Core.stats(S,c.id),r=rec.find(x=>x.c.id===c.id),dv=ab.filter(l=>l.cid===c.id).reduce((s,l)=>s+(l.preco||0)+(l.taxa||0),0),nx=S.ag.filter(a=>a.cid===c.id&&ATIVO.includes(a.st)&&a.data>=iso).sort((a,b)=>a.data.localeCompare(b.data))[0];

 if(ab.length)h+=`<div class="card"><div class="row"><b class="sp warn">A receber: ${R(dv)}</b><button class="btn sm wa" onclick="cobrar('${c.id}')">${ico('msg')}Cobrar</button></div>${ab.map(l=>`<div class="kv"><span>${dCurta(D.iso(l.dt))} · ${esc(l.sn)}</span><b>${R((l.preco||0)+(l.taxa||0))} <button class="lnk" onclick="openSheet('receb',{id:'${l.id}'})">receber</button></b></div>`).join('')}</div>`;

 const mes=Cx.per(S,hoje().slice(0,8)+'01',hoje()),meta=S.meta;
 let h=`<div class="seg" style="margin-bottom:14px">${[['hoje','Hoje'],['semana','Semana'],['mes','Mês'],['ant','Mês passado']].map(([k,t])=>`<button class="${ui.per===k?'on':''}" onclick="ui.per='${k}';draw()">${t}</button>`).join('')}</div>
 <div class="hero"><small>${de===ate?dLonga(de):dCurta(de)+' a '+dCurta(ate)}</small><div class="big num">${R(x.fat)}</div><div class="sm" style="opacity:.9">${x.n} ${x.n===1?'lavagem':'lavagens'} · lucro ${R(x.luc)}</div>

 if(ui.per==='mes'||ui.per==='hoje')h+=meta?`<div class="card"><div class="row"><b class="sp">Meta do mês</b><span class="mut sm">${R0(mes.fat)} de ${R0(meta)}</span></div><div class="bar ${mes.fat>=meta?'ok':''}" style="margin-top:8px;height:10px"><i data-w="${mes.fat/meta*100}" style="width:0"></i></div><p class="xs mut" style="margin-top:6px">${mes.fat>=meta?'Meta batida! 🎉':'Faltam '+R(meta-mes.fat)+' · '+metaDia(meta-mes.fat)}</p></div>`:`<button class="alert info" onclick="ui.aj='meta';go('ajustes')">${ico('trend')}<div><b>Defina uma meta do mês</b><span>Mostra quanto falta por dia de trabalho.</span></div></button>`;
 h+=`<div class="card"><b>Por forma de pagamento</b>${[['pix','Pix'],['dinheiro','Dinheiro'],['cartao','Cartão'],['fiado','Fiado (a receber)']].map(([k,t])=>`<div style="margin-top:10px"><div class="row sm"><span class="sp">${t}</span><b>${R(x.pg[k]||0)}</b></div><div class="bar ${k==='fiado'?'warn':''}" style="margin-top:4px"><i data-w="${(x.pg[k]||0)/pgT*100}" style="width:0"></i></div></div>`).join('')}</div>`;
 if(ab.length){const by={};ab.forEach(l=>{const k=l.cid||l.cn;(by[k]=by[k]||{c:l.cid,n:l.cn,L:[],t:0});by[k].L.push(l);by[k].t+=(l.preco||0)+(l.taxa||0)});
  h+=`<div class="sec"><h2>A receber</h2><b class="warn">${R(abT)}</b></div>${Object.values(by).sort((a,b)=>b.t-a.t).map(g=>`<div class="li" style="cursor:default"><div class="av s">${ini(g.n)}</div><div class="tx"><b>${esc(g.n||'Sem cliente')}</b><small>${g.L.length} ${g.L.length===1?'lavagem':'lavagens'} · desde ${dCurta(D.iso(Math.min(...g.L.map(l=>l.dt))))}</small></div><b class="warn">${R0(g.t)}</b>${g.c?`<button class="icb" onclick="cobrar('${g.c}')" aria-label="Cobrar">${ico('msg')}</button>`:''}<button class="icb" onclick="${g.L.length===1?`openSheet('receb',{id:'${g.L[0].id}'})`:`openSheet('cliv',{id:'${g.c}'})`}" aria-label="Receber">${ico('check')}</button></div>`).join('')}`}
 h+=`<div class="row" style="margin-top:14px"><button class="btn" onclick="copiar(resumoTxt('${de}','${ate}'),'Resumo copiado')">${ico('copy')}Resumo</button><button class="btn" onclick="baixar('lavagens-${de}-a-${ate}.csv',Core.csv({...S,lav:Cx.per(S,'${de}','${ate}').L}),'text/csv')">${ico('list')}Planilha (CSV)</button></div>`;

  <div class="row wrap"><button class="btn" onclick="S.bkAt=Date.now();save();baixar('lavacao-backup-'+hoje()+'.json',Core.exp(S))">${ico('down')}Baixar backup</button><button class="btn" onclick="copiar(Core.exp(S),'Backup copiado')">${ico('copy')}Copiar</button><button class="btn" onclick="openSheet('colar')">${ico('copy')}Colar backup</button><label class="btn">${ico('up')}Restaurar arquivo<input type="file" accept=".json,application/json,text/plain" hidden onchange="impArq(this)"></label></div>
  ${S.bkAt?`<p class="xs mut" style="margin-top:8px">Último backup: ${ago(S.bkAt)}</p>`:''}
  ${sn.length?`<p class="sm b" style="margin-top:14px">Cópias automáticas</p>${sn.map(k=>`<div class="kv"><span>${dCurta(k.slice(SNAP.length))}</span><button class="lnk" onclick="twice('r${k}',()=>restSnap('${k}'))">${armed('r'+k,'Restaurar','Confirmar?')}</button></div>`).join('')}`:''}
  <div class="row" style="margin-top:14px"><button class="btn sm" onclick="ui.tests=selfTest();draw()">${ico('check')}Rodar autoteste</button>${ui.tests?`<span class="sm ${ui.tests.every(x=>x[1])?'ok':'bad'}">${ui.tests.filter(x=>x[1]).length}/${ui.tests.length} aprovados</span>`:''}</div>
  ${ui.tests&&!ui.tests.every(x=>x[1])?ui.tests.filter(x=>!x[1]).map(x=>`<p class="xs bad">✗ ${esc(x[0])}</p>`).join(''):''}${(ui.errs||[]).length?`<p class="xs bad" style="margin-top:8px">Erros recentes: ${ui.errs.map(esc).join(' · ')}</p>`:''}`);
 h+=AJ('aprender','Como funciona (para aprender)','book',`<div class="learn">
  <p><b>GPS.</b> O navegador do celular tem uma função chamada <code>navigator.geolocation</code>. O app pede permissão e recebe latitude e longitude a cada poucos segundos (<code>watchPosition</code>). Só liga quando há atendimento no dia, para poupar bateria.</p>
  <p><b>Distância.</b> Sem internet, o app calcula a distância em linha reta entre dois pontos do globo (fórmula de Haversine) e multiplica por um "fator de ruas" (1,35), porque as ruas fazem curvas. Tempo = distância ÷ velocidade média.</p>
  <p><b>Rota pelas ruas.</b> Com internet, o app pergunta ao <b>OSRM</b>, um serviço gratuito que usa o mapa aberto <b>OpenStreetMap</b>: "quanto tempo e quantos km do ponto A ao B?". Ele devolve também o desenho da rota.</p>
  <p><b>Melhor ordem.</b> Com até 8 paradas o app testa <i>todas</i> as ordens possíveis (40.320 combinações em milissegundos) e escolhe a que não atrasa horário marcado e roda menos. Acima disso usa um atalho: vai sempre ao mais próximo e depois tenta desfazer cruzamentos (2-opt).</p>
  <p><b>Previsão de chegada.</b> Em cadeia: saída + trajeto = chegada; se chegar antes da hora marcada, espera; fim = início + duração do serviço; a próxima saída é o fim + a folga. Por isso um atraso no 1º empurra os outros.</p>
  <p><b>Mapa.</b> O desenho do mapa é a biblioteca <b>Leaflet</b> com as imagens do OpenStreetMap. Endereço → coordenadas vem do <b>Nominatim</b> (também do OpenStreetMap). A previsão do tempo é do <b>Open-Meteo</b>. Todos gratuitos e sem chave.</p>
  <p><b>Dados.</b> Ficam no próprio celular, no <code>localStorage</code> (texto) e no <code>IndexedDB</code> (fotos). Por isso o backup é importante: se apagar os dados do navegador, apaga o app.</p>
  <p><b>Testes.</b> As regras (preço, estoque, rota, horários) são funções separadas da tela. O "autoteste" roda dezenas de situações e confere os resultados. É assim que se evita que uma mudança quebre outra coisa.</p></div>`);
 h+=`<p class="xs mut" style="text-align:center;margin:18px 0">Lavação ${APP_V} · dados v${SCHEMA}</p>`;

function ajHora(k,v){if(!D.okHm(v))return toast('Hora inválida.',false);const J={...S.cfg.jor,[k]:v};if(D.m(J.fim)<=D.m(J.ini))return toast('O fim precisa ser depois do início.',false);S.cfg.jor[k]=v;save();toast('Jornada salva')}
function fidSet(o){const f=S.fid,ci=o.ciclo!=null?num(o.ciclo):f.ciclo,pct=o.pct!=null?num(o.pct):((f.faixas.find(x=>x.pos===f.ciclo)||f.faixas[0]||{}).pct||80);done(Core.setFid(S,{on:o.on!=null?o.on:f.on,ciclo:ci,faixas:[{pos:ci,pct}]}),'Fidelidade salva')}
SHEETS.colar=()=>shHead('Colar backup','Do app antigo (Dados e sistema → Exportar) ou de outro aparelho')+`<textarea id="bkt" style="min-height:200px" placeholder='{"app":"lavacao",...}'></textarea><p class="xs mut" style="margin:8px 0">Substitui os dados deste aparelho. Antes, guardamos uma cópia do que está aqui.</p><p class="err" id="sherr"></p><button class="btn p lg w" onclick="impTxt($('bkt').value)">Restaurar</button>`;
function impTxt(t){const r=Core.imp(t);if(!r.ok)return shErr(r.e);try{localStorage.setItem('lavacao-preimport',Core.exp(S))}catch(e){}S=r.s;S.serv.forEach(v=>{if(!v.dur)v.dur=60});RT.P={};closeSheet();done({ok:true},'Backup restaurado: '+S.cli.length+' clientes, '+S.lav.length+' lavagens')}
function impArq(inp){const f=inp.files&&inp.files[0];if(!f)return;f.text().then(t=>{const r=Core.imp(t);if(!r.ok)return toast(r.e,false);try{localStorage.setItem('lavacao-preimport',Core.exp(S))}catch(e){}S=r.s;RT.P={};done({ok:true},'Backup restaurado')})}
function restSnap(k){const r=Store.restore(localStorage,k);if(!r.ok)return toast(r.e,false);try{localStorage.setItem('lavacao-prerestore',Core.exp(S))}catch(e){}S=r.s;RT.P={};done({ok:true},'Cópia restaurada')}
