<title>Lavação Móvel</title><style>/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {
	cursor: crosshair;
	}
.leaflet-popup-pane,
.leaflet-control {
	cursor: auto;
	}
.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {
	cursor: move;
	cursor: -webkit-grabbing;
	cursor:    -moz-grabbing;
	cursor:         grabbing;
	}

/* marker & overlays interactivity */
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,

	background-image: url(images/marker-icon.png);

/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {
	background: #fff;

.leaflet-control-attribution,

.leaflet-touch .leaflet-control-attribution,
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {

.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {

/* popup */

.leaflet-popup {
	position: absolute;
	text-align: center;

	}
.leaflet-popup-content-wrapper {

	width: 17px;
	height: 17px;
	padding: 1px;

	margin: -10px auto 0;

	   -moz-transform: rotate(45deg);

.leaflet-oldie .leaflet-popup-content-wrapper {

.leaflet-oldie .leaflet-control-zoom,
.leaflet-oldie .leaflet-control-layers,
.leaflet-oldie .leaflet-popup-content-wrapper,

	}


/* div icon */

.leaflet-div-icon {
	background: #fff;
	border: 1px solid #666;
	}


/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {
	position: absolute;
	padding: 6px;
	background-color: #fff;
	border: 1px solid #fff;
	border-radius: 3px;
	color: #222;
	white-space: nowrap;
	-webkit-user-select: none;
	-moz-user-select: none;
	-ms-user-select: none;

	}
.leaflet-tooltip.leaflet-interactive {
	cursor: pointer;
	pointer-events: auto;
	}
.leaflet-tooltip-top:before,
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	position: absolute;
	pointer-events: none;
	border: 6px solid transparent;
	background: transparent;
	content: "";
	}

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {
	left: 50%;
	margin-left: -6px;
	}
.leaflet-tooltip-top:before {
	bottom: 0;
	margin-bottom: -12px;
	border-top-color: #fff;
	}
.leaflet-tooltip-bottom:before {
	top: 0;
	margin-top: -12px;
	margin-left: -6px;
	border-bottom-color: #fff;
	}
.leaflet-tooltip-left {
	margin-left: -6px;
}
.leaflet-tooltip-right {
	margin-left: 6px;
}
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	top: 50%;
	margin-top: -6px;
	}
.leaflet-tooltip-left:before {
	right: 0;
	margin-right: -12px;
	border-left-color: #fff;
	}
.leaflet-tooltip-right:before {
	left: 0;
	margin-left: -12px;
	border-right-color: #fff;
	}

/* Printing */

@media print {
	/* Prevent printers from removing background-images of controls. */
	.leaflet-control {
		-webkit-print-color-adjust: exact;
		print-color-adjust: exact;
		}
	}

/* ---------- 1. cores e medidas ----------

:root{--g1:#0f766e;--g2:#0e7490;--g3:#1d4ed8;--bp:#0f766e;--bpd:#2dd4bf;--bps:#115e59;
 --bg:#f2f5f7;--sf:#fff;--sf2:#f5f8fa;--ink:#0b1620;--ink2:#26343f;--mut:#4b5a66;--line:rgba(11,22,32,.1);--line2:rgba(11,22,32,.18);

 --pri:var(--bpd);--pri2:var(--bpd);--pris:color-mix(in srgb,var(--pri) 15%,transparent);--ok:#4ade80;--oks:rgba(74,222,128,.12);--warn:#fbbf24;--warns:rgba(251,191,36,.12);--bad:#f87171;--bads:rgba(248,113,113,.12);--info:#60a5fa;--infos:rgba(96,165,250,.12);--wa:#1fa855;

 --pri:var(--bpd);--pri2:var(--bpd);--pris:color-mix(in srgb,var(--pri) 15%,transparent);--ok:#4ade80;--oks:rgba(74,222,128,.12);--warn:#fbbf24;--warns:rgba(251,191,36,.12);--bad:#f87171;--bads:rgba(248,113,113,.12);--info:#60a5fa;--infos:rgba(96,165,250,.12);--wa:#1fa855;

/* ---------- 2. base ---------- */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,system-ui,sans-serif;font-feature-settings:"tnum" 1}
body{min-height:100dvh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid color-mix(in srgb,var(--pri) 60%,transparent);outline-offset:2px}
h1,h2,h3{margin:0;letter-spacing:-.02em;line-height:1.15}h1{font-size:28px;font-weight:800}h2{font-size:19px;font-weight:750}h3{font-size:16px;font-weight:700}
p{margin:0}a{color:var(--pri2)}
.mut{color:var(--mut)}.sm{font-size:13.5px}.xs{font-size:12.5px}.b{font-weight:700}.num{font-variant-numeric:tabular-nums}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.info{color:var(--info)}.pri{color:var(--pri)}
.late{color:var(--bad);font-weight:750}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sp{flex:1}.sp-r{margin-left:auto;text-align:right}

/* ---------- 3. estrutura: topo, conteúdo, abas, menu lateral ---------- */
.app{display:flex;min-height:100dvh}
.side{display:none}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid transparent;transition:border-color .2s}
.top.sc{border-bottom-color:var(--line)}
.top .tt{flex:1;min-width:0}.top .tt h1{font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top .tt small{display:block;color:var(--mut);font-size:13px;font-weight:600}
.back{width:40px;height:40px;border-radius:12px;border:0;background:var(--sf);box-shadow:var(--sh);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
main{flex:1;padding:6px 16px calc(var(--tab) + 92px + env(safe-area-inset-bottom));width:100%;max-width:780px;margin:0 auto}
main.wide{max-width:1240px}
.card,details.card{scroll-margin-top:84px}
.enter>*{animation:rise .38s var(--ease) both}.enter>*:nth-child(2){animation-delay:.03s}.enter>*:nth-child(3){animation-delay:.06s}.enter>*:nth-child(n+4){animation-delay:.09s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--sf) 88%,transparent);backdrop-filter:saturate(1.6) blur(20px);-webkit-backdrop-filter:saturate(1.6) blur(20px);border-top:1px solid var(--line)}
.tabs button{flex:1;max-width:96px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;min-height:50px;font-size:11.5px;font-weight:650;color:var(--mut);cursor:pointer;border-radius:12px;position:relative}
.tabs button svg{width:24px;height:24px;transition:transform .25s var(--spring)}
.tabs button.on{color:var(--pri)}.tabs button.on svg{transform:translateY(-1px) scale(1.08)}
.tabs .dot{position:absolute;top:4px;right:calc(50% - 18px);min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;line-height:16px}
.fab{position:fixed;right:18px;bottom:calc(var(--tab) + 18px + env(safe-area-inset-bottom));z-index:29;height:56px;padding:0 20px 0 16px;border-radius:18px;border:0;background:var(--grad);color:#fff;font-weight:750;display:flex;align-items:center;gap:8px;box-shadow:0 14px 30px -10px rgba(14,90,140,.6);cursor:pointer;transition:transform .2s var(--spring)}
.fab:active{transform:scale(.95)}.fab svg{width:22px;height:22px}

.actbar.on{transform:none;opacity:1;pointer-events:auto}
.actbar .btn{width:100%;min-height:58px;font-size:17px;border-radius:18px;justify-content:flex-start;padding:0 18px;box-shadow:0 16px 32px -12px rgba(11,22,32,.55)}
.actbar .btn span{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;flex:1;min-width:0}.actbar .btn small{font-size:12.5px;font-weight:600;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

}

/* ---------- 4. componentes ---------- */
.card{background:var(--sf);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin:0 0 14px;border:1px solid var(--line)}

.cores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cores button{display:flex;align-items:center;gap:8px;padding:10px;min-height:44px;border-radius:14px;border:1.5px solid var(--line);background:var(--sf);font-weight:700;font-size:13.5px;cursor:pointer;color:var(--ink)}.cores i{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2));flex:none}.cores button.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}

.drow,.vrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.drow:last-child,.vrow:last-child{border-bottom:0}.drow .tx,.vrow .tx{flex:1;min-width:0}.drow small,.vrow small{display:block;color:var(--mut);font-size:13px}.vrow b{display:block}
.custos{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line2)}
.marg{display:flex;align-items:center;gap:10px;margin-top:10px}.marg .bar{flex:1}
.cnt{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--warns);color:var(--warn);font-size:12px;font-weight:800}.cnt.bad{background:var(--bads);color:var(--bad)}
details.pend>summary{gap:10px}.pend .alert{margin-bottom:8px}
.lav>button.row{width:100%;border:0;background:none;padding:0;cursor:pointer;color:inherit;font:inherit;align-items:flex-start}

/* ---------- 5. telas ---------- */
/* Hoje: cartão do dia */
.day{border-radius:24px;padding:16px;color:#fff;background:var(--grad);box-shadow:0 20px 40px -22px rgba(31,95,216,.65);margin-bottom:14px;position:relative;overflow:hidden}
.day::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.2),transparent 65%);pointer-events:none}
.day small{opacity:.9;font-weight:700;font-size:12px;letter-spacing:.03em;text-transform:uppercase}.day b{display:block;font-size:26px;font-weight:850;letter-spacing:-.02em}.day b span{font-size:14px;font-weight:650;opacity:.9}
.dayr{text-align:right}.dayr b{font-size:20px}
.day .dots{display:flex;align-items:center;margin-top:14px;overflow-x:auto;scrollbar-width:none;padding:3px}.day .dots::-webkit-scrollbar{display:none}
.day .dots>i{flex:1;min-width:10px;height:2px;background:rgba(255,255,255,.4)}
.day .dots button{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(255,255,255,.14);color:#fff;font-weight:800;font-size:12px;display:grid;place-items:center;cursor:pointer;padding:0}
.day .dots button.ok{background:#fff;color:#15803d;border-color:#fff}.day .dots button.ok svg{width:18px;height:18px}.day .dots button.on{background:#fff;color:var(--g2);border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.35);animation:ring 1.8s infinite}
@keyframes ring{50%{box-shadow:0 0 0 7px rgba(255,255,255,.12)}}
.dayl{display:flex;align-items:flex-start;gap:6px;font-size:13px;margin-top:12px;opacity:.95}.dayl svg{width:16px;height:16px;margin-top:1px}.dayl b{display:inline;font-size:13px}
.agora{border:1.5px solid color-mix(in srgb,var(--pri) 45%,transparent);box-shadow:0 0 0 4px var(--pris),var(--sh)}
.lista{padding:4px}.lrow{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px;min-height:52px;border-radius:12px;text-align:left;cursor:pointer;color:var(--ink)}.lrow:hover{background:var(--sf2)}
.lrow>b{width:46px;font-size:15px}.lrow>i{width:10px;height:10px;border-radius:50%;flex:none}.lrow .tx{flex:1;min-width:0}.lrow .tx>b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lrow .tx small{color:var(--mut);font-size:12.5px}
.lrow.on{background:var(--pris)}.lrow.ok{opacity:.6}.lrow>svg{color:var(--mut);width:18px;height:18px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}.quick button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;min-height:72px;border-radius:16px;border:1px solid var(--line);background:var(--sf);box-shadow:var(--sh);font-weight:700;font-size:12.5px;color:var(--ink2);cursor:pointer;text-align:center}.quick svg{color:var(--pri)}
.pp{border:1.5px dashed color-mix(in srgb,var(--pri) 45%,transparent)}.ppi{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:10px 0;text-align:left;cursor:pointer;border-bottom:1px solid var(--line);color:var(--ink)}.ppi:last-child{border-bottom:0}
.ppi>i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;background:var(--pris);color:var(--pri);flex:none}.ppi>i svg{width:16px;height:16px}.ppi span{flex:1}.ppi b{display:block;font-size:14.5px}.ppi small{color:var(--mut);font-size:12.5px}.ppi.ok{opacity:.6}.ppi.ok>i{background:var(--oks);color:var(--ok)}.ppi>svg{color:var(--mut)}
@media(min-width:1000px){.hj{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:18px;align-items:start}.hj>div>.sec:first-child{margin-top:4px}}
/* Agenda */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:4px 0 14px}
.wk button{border:1px solid var(--line);background:var(--sf);border-radius:15px;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;transition:all .2s var(--ease);min-width:0;color:var(--ink)}
.wk button small{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase}.wk button b{font-size:18px}.wk button em{font-style:normal;font-size:10.5px;color:var(--mut);height:14px;white-space:nowrap}
.wk .dots{display:flex;gap:2px;height:6px}.wk .dots i{width:5px;height:5px;border-radius:50%;background:var(--pri)}
.wk button.on{background:var(--ink);border-color:var(--ink);color:var(--sf)}.wk button.on small,.wk button.on em{color:inherit;opacity:.8}.wk button.on .dots i{background:var(--sf)}
.wk button.hj b{color:var(--pri)}.wk button.on.hj b{color:inherit}.wk button.off{opacity:.55}
.wkh{display:flex;align-items:center;gap:8px;margin-top:6px}
.free{display:flex;align-items:center;gap:8px;width:100%;border:1.5px dashed var(--line2);background:none;border-radius:14px;padding:10px 12px;min-height:46px;color:var(--pri);font-weight:700;font-size:14px;cursor:pointer;margin-bottom:10px}
/* Rota */
.rwrap .rmap{position:relative;isolation:isolate;overflow:hidden;background:var(--sf2)}
.mapc{position:absolute;right:12px;top:12px;z-index:500;display:flex;flex-direction:column;gap:8px}.mapc .icb{box-shadow:var(--sh)}
#map{position:absolute;inset:0}
.leaflet-container{font:inherit;background:var(--sf2);isolation:isolate}
.mk{width:32px;height:32px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;box-shadow:0 4px 10px rgba(0,0,0,.35);border:2px solid #fff}
.mk span{transform:rotate(45deg)}.mk span svg{width:18px;height:18px}.mk.cur{width:40px;height:40px;font-size:15px;box-shadow:0 0 0 6px rgba(37,99,235,.25),0 6px 14px rgba(0,0,0,.35)}
.mkb{width:30px;height:30px;border-radius:10px;background:#0b1620;color:#fff;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.35)}.mkb svg{width:17px;height:17px}
.mkd{width:24px;height:24px;border-radius:50%;background:#15803d;color:#fff;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);opacity:.85}.mkd svg{width:13px;height:13px}
.me{width:18px;height:18px;border-radius:50%;background:#2563eb;border:3px solid #fff;animation:mep 2s infinite}
@keyframes mep{0%{box-shadow:0 0 0 0 rgba(37,99,235,.5)}70%{box-shadow:0 0 0 14px rgba(37,99,235,0)}100%{box-shadow:0 0 0 0 rgba(37,99,235,0)}}
.rsum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}.rsum b{display:block;font-size:18px;font-weight:850;letter-spacing:-.02em}.rsum span{font-size:11.5px;color:var(--mut);font-weight:650}
.aut{margin-top:8px}.aut .bar{height:9px}.aut p svg{width:14px;height:14px;vertical-align:-2px}
.leg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);font-weight:650;padding:2px 0 6px 14px}.leg svg{width:14px;height:14px}
.stop{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:16px;background:var(--sf);border:1px solid var(--line);margin-bottom:8px}
.stop .n{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;flex:none}
.stop .tx{flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;cursor:pointer;color:inherit}.stop .tx>b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stop .tx small{color:var(--mut);font-size:12.5px}
.stop .mv{display:flex;flex-direction:column;gap:4px}.stop .mv button{width:42px;height:32px;border:1px solid var(--line);background:var(--sf2);border-radius:8px;cursor:pointer;display:grid;place-items:center;padding:0;color:var(--ink)}.stop .mv button:disabled{opacity:.35}.stop .mv svg{width:15px;height:15px}
.stop.base{background:var(--sf2)}.stop.base .n{background:var(--ink)}.stop.base .n svg{width:16px;height:16px;color:var(--sf)}
.rwrap.cel{position:fixed;left:0;right:0;top:var(--th,64px);bottom:calc(var(--tab) + env(safe-area-inset-bottom));z-index:5}
.rwrap.cel .rmap{position:absolute;inset:0}
.rwrap.cel .rpan{position:absolute;left:0;right:0;bottom:0;height:100%;background:var(--bg);border-radius:24px 24px 0 0;box-shadow:0 -12px 34px rgba(0,0,0,.2);z-index:600;transform:translateY(var(--off));transition:transform .4s var(--spring);display:flex;flex-direction:column;will-change:transform}
.rpan[data-s=min]{--off:calc(100% - 158px)}.rpan[data-s=mid]{--off:48%}.rpan[data-s=max]{--off:6%}
.rgrab{border:0;background:none;padding:12px 0 10px;cursor:grab;width:100%;flex:none;touch-action:none}.rgrab i{display:block;width:46px;height:5px;border-radius:5px;background:var(--line2);margin:0 auto}
.rwrap.cel .rbody{flex:1;overflow:auto;padding:0 16px 30px;overscroll-behavior:contain}
.rpan[data-s=min] .rbody{overflow:hidden}
@media(min-width:900px){.rwrap{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:start}.rwrap .rmap{position:sticky;top:84px;height:calc(100dvh - 110px);border-radius:22px;box-shadow:var(--sh);border:1px solid var(--line)}.rgrab{display:none}}
/* seletor de ponto no mapa */
.pickw{position:relative;height:min(50vh,420px);border-radius:18px;overflow:hidden;margin-top:10px;isolation:isolate;background:var(--sf2);border:1px solid var(--line)}
.pickpin{position:absolute;left:50%;top:50%;z-index:700;pointer-events:none;transform:translate(-50%,calc(-100% + 5px));display:flex;flex-direction:column;align-items:center}
.pickpin i{width:10px;height:10px;border-radius:50%;background:#2563eb;border:2px solid #fff;box-shadow:0 0 0 3px rgba(37,99,235,.35);margin-top:4px}
.pickw .mapc{z-index:700}
.pres{display:flex;flex-direction:column;gap:6px;margin-top:8px;max-height:220px;overflow:auto}.pres button{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--sf);border-radius:14px;padding:10px 12px;text-align:left;cursor:pointer;color:var(--ink)}
.pres button span{flex:1;min-width:0}.pres b{display:block;font-size:14px}.pres small{color:var(--mut);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pres em{font-style:normal;font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px;white-space:nowrap}.pres em.ok{background:var(--oks)}.pres em.warn{background:var(--warns)}
/* calculadora */
.stick{position:sticky;top:76px}
@media(min-width:900px){.cols{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;align-items:start}.cols>*{min-width:0}}
/* bloqueio por PIN */
#lock{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;padding:24px;animation:rise .3s var(--ease)}#lock.out{opacity:0;transition:opacity .25s}
.lk{width:100%;max-width:320px;text-align:center}.lkb{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:6px}.lkb .av{width:64px;height:64px;border-radius:20px}.lkb .av svg{width:30px;height:30px}.lkb b{font-size:20px}
.lkd{display:flex;justify-content:center;gap:14px;margin:22px 0}.lkd i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2)}.lkd i.on{background:var(--pri);border-color:var(--pri)}.lkd.sh{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.lkk{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}.lkk button{height:66px;border-radius:50%;border:1px solid var(--line);background:var(--sf);font-size:26px;font-weight:650;cursor:pointer;box-shadow:var(--sh);color:var(--ink)}.lkk button:active{background:var(--pris)}

/* ---------- 6. modo sol: bordas mais grossas, sem sombras nem transparência ---------- */
html.sol body{font-size:17px}
html.sol .card,html.sol .li,html.sol .stat,html.sol .quick button,html.sol .mini3 button,html.sol .stop,html.sol .pay button,html.sol .act{border-width:2px;box-shadow:none}
html.sol .top,html.sol .tabs{backdrop-filter:none;-webkit-backdrop-filter:none;background:#fff}html.sol .tabs button{color:#222}html.sol .tabs button.on{color:var(--pri)}
html.sol .btn,html.sol .chip{border-width:2px}html.sol .chip.on{background:#000;color:#fff}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

// ajustes padrão (arred: arredonda a taxa de deslocamento para cima, em R$; 0 = não arredonda)
function CFG0(){return{base:null,jor:{ini:'08:00',fim:'18:00',dias:[1,2,3,4,5,6],alm:'12:00',almMin:60},vel:25,fator:1.35,ajt:100,folga:10,aut:60,pix:'',cobraTaxa:true,arred:1,add:[],
 chk:['Riscos na lataria','Amassados','Rodas raladas','Vidros trincados','Manchas no estofado','Objetos de valor no carro'],msg:{...MSG0}}}
const ST_AG={agendado:'Agendado',confirmado:'Confirmado',caminho:'A caminho',andamento:'Em andamento',concluido:'Concluído',cancelado:'Cancelado',faltou:'Cliente ausente'};
const ATIVO=['agendado','confirmado','caminho','andamento'];
const JAN={fixa:'Horário marcado',manha:'Manhã',tarde:'Tarde',livre:'Qualquer horário'};
const PGN={pix:'Pix',dinheiro:'Dinheiro',cartao:'Cartão',fiado:'Fiado'};

// ---------- planejamento do dia: horários de chegada em cadeia ----------
const Plan={
 // janela em que a parada pode começar (ms): hora marcada = instante exato; manhã/tarde/qualquer = intervalo da jornada
 win(s,iso,J){if(s.hora){const t=D.ts(iso,s.hora);return[t,t]}const a=D.m(J.ini),al=D.m(J.alm||'12:00'),ae=al+(+J.almMin||0),b=D.m(J.fim);
  const w=s.jan==='manha'?[a,al]:s.jan==='tarde'?[ae,b]:[a,b];return[D.tsm(iso,w[0]),D.tsm(iso,w[1])]},
 // t0: saída (ms); legs[i]: trecho até a parada i {km,min}. Devolve chegada, início, fim, espera e atraso de cada parada.
 chain(t0,stops,legs,cfg,iso){const J=cfg.jor,aj=(cfg.ajt||100)/100,fimJ=D.ts(iso,J.fim);let t=t0,km=0,atr=0,atrF=0,esp=0;
  const out=stops.map((s,i)=>{const L=legs[i]||{km:0,min:0},mv=L.min*aj,chega=t+mv*6e4,[w0,w1]=s._w||Plan.win(s,iso,J),ini=Math.max(chega,w0),atraso=Math.max(0,ini-w1)/6e4,espera=(ini-chega)/6e4,fim=ini+(s.dur||60)*6e4;
   km+=L.km||0;atr+=atraso;if(s.hora)atrF+=atraso;esp+=espera;t=fim+(cfg.folga||0)*6e4;return{id:s.id,km:L.km||0,min:mv,est:!!L.est,sem:!!L.sem,chega,ini,fim,espera,atraso,fora:fim>fimJ}});
  return{stops:out,km,fim:t,atraso:atr,atrF,espera:esp,t0}},
 // "custo" de uma ordem: cada minuto de atraso em hora marcada pesa 50× mais que estourar uma janela
 // (manhã/tarde/qualquer horário), porque hora marcada é compromisso; depois contam o tempo do dia e os km
 cost(c){const f=c.atrF||0;return f*1000+(c.atraso-f)*20+(c.fim-c.t0)/6e4+c.km*0.5},
 // melhor ordem: testa todas as ordens até 8 paradas (40.320); acima disso, vizinho mais próximo + 2-opt.
 // M(i,j): trecho entre pontos (0 = saída, 1..n = paradas). Para ser rápido no celular, a tabela de trechos e as
 // janelas de horário são calculadas uma vez só, e cada ordem testada é só uma conta (sem criar objetos).
 opt(stops,M,t0,cfg,iso){const n=stops.length,J=cfg.jor,aj=(cfg.ajt||100)/100,fol=(cfg.folga||0)*6e4;
  const T=[...Array(n+1)].map((_,i)=>[...Array(n+1)].map((_,j)=>i===j?null:M(i,j))),W=stops.map(s=>Plan.win(s,iso,J)),DU=stops.map(s=>(s.dur||60)*6e4),FX=stops.map(s=>!!s.hora);
  const custo=p=>{let t=t0,km=0,atr=0,atrF=0,prev=0;for(let k=0;k<n;k++){const i=p[k],L=T[prev][i+1],chega=t+L.min*aj*6e4,w=W[i],ini=chega>w[0]?chega:w[0],a=ini>w[1]?(ini-w[1])/6e4:0;km+=L.km||0;atr+=a;if(FX[i])atrF+=a;t=ini+DU[i]+fol;prev=i+1}
   return atrF*1000+(atr-atrF)*20+(t-t0)/6e4+km*0.5};
  const idx=[...Array(n).keys()];let bp=idx.slice(),bv=n?custo(bp):0;const take=p=>{const v=custo(p);if(v<bv-1e-9){bv=v;bp=p.slice()}};
  if(n>=2&&n<=8){const a=idx.slice(),c=Array(n).fill(0);let i=0;while(i<n){if(c[i]<i){const k=i%2?c[i]:0;[a[k],a[i]]=[a[i],a[k]];take(a);c[i]++;i=0}else{c[i]=0;i++}}}
  else if(n>8){const left=new Set(idx),p=[];let cur=0;while(left.size){let b=null,v0=1e18;left.forEach(j=>{const v=T[cur][j+1].min;if(v<v0){v0=v;b=j}});p.push(b);left.delete(b);cur=b+1}
   bp=p;bv=custo(p);let imp=true,g=0;while(imp&&g++<50){imp=false;for(let i=0;i<n-1;i++)for(let k=i+1;k<n;k++){const q=bp.slice(0,i).concat(bp.slice(i,k+1).reverse(),bp.slice(k+1)),v=custo(q);if(v<bv-1e-9){bv=v;bp=q;imp=true}}}}
  const st=bp.map(i=>({...stops[i],_w:W[i]})),lg=bp.map((x,k)=>T[k?bp[k-1]+1:0][x+1]);
  return{order:bp.map(i=>stops[i].id),chain:Plan.chain(t0,st,lg,cfg,iso)}},
 // horários livres do dia: jornada menos almoço, horas marcadas e (ocup) o que já está planejado na rota
 // ocup: [{ini,fim}] em ms; ign: agendamento a ignorar (quando se está editando ele mesmo)
 livres(S,iso,need,now,ocup,ign){const J=S.cfg.jor;if(!(J.dias||[]).includes(D.dow(iso)))return[];
  const viag=20,fol=S.cfg.folga||0,al=D.m(J.alm||'12:00'),ae=al+(+J.almMin||0);
  let W=(+J.almMin>0?[[D.m(J.ini),al],[ae,D.m(J.fim)]]:[[D.m(J.ini),D.m(J.fim)]]);
  if(now&&D.iso(now)===iso){const nm=Math.ceil(D.mins(now)/5)*5;W=W.map(([a,b])=>[Math.max(a,nm),b]).filter(([a,b])=>b>a)}
  const busy=S.ag.filter(a=>a.id!==ign&&a.data===iso&&ATIVO.includes(a.st)&&a.hora).map(a=>[D.m(a.hora)-viag,D.m(a.hora)+(a.dur||60)+fol])
   .concat((ocup||[]).map(o=>[D.mins(o.ini)-viag,D.mins(o.fim)+fol])).sort((x,y)=>x[0]-y[0]);
  const out=[];W.forEach(([a,b])=>{let s=a;busy.forEach(([x,y])=>{if(y<=s||x>=b)return;if(x>s)out.push([s,x]);s=Math.max(s,y)});if(b>s)out.push([s,b])});
  return out.filter(([a,b])=>b-a>=need).map(([a,b])=>({de:D.hm(a),ate:D.hm(b),min:b-a}))}
};

// ---------- agenda ----------
const Ag={
 val(S,f){
  const c=S.cli.find(x=>x.id===f.cid);if(!c)return err('Escolha o cliente.');
  if(!D.okIso(f.data))return err('Escolha a data.');
  const hora=String(f.hora||'').trim();if(hora&&!D.okHm(hora))return err('Hora inválida (use 09:30).');
  const v=S.serv.find(x=>x.id===f.sid);if(!v)return err('Escolha o serviço.');
  if(f.cat&&!CATS.some(k=>k[0]===f.cat))return err('Tipo de carro inválido.');
  const vid=f.vid&&(c.vei||[]).some(x=>x.id===f.vid)?f.vid:'';
  const ve=vid?(c.vei||[]).find(x=>x.id===vid):null,cat=ve?ve.cat:(f.cat||'');
  const dur=f.dur==null||String(f.dur).trim()===''?(v.dur||60):num(f.dur);if(!(dur>=10&&dur<=600))return err('Duração entre 10 e 600 minutos.');
  const nv=x=>x==null||String(x).trim()===''?null:num(x),preco=nv(f.preco),taxa=nv(f.taxa);
  if(preco!==null&&!(preco>=0))return err('Preço inválido.');if(taxa!==null&&!(taxa>=0))return err('Taxa inválida.');
  const rec=f.rec==null||f.rec===''?0:num(f.rec);if(!(Number.isInteger(rec)&&rec>=0&&rec<=180))return err('Repetição inválida.');
  const jan=hora?'fixa':(['manha','tarde','livre'].includes(f.jan)?f.jan:'livre');
  const add=(f.add||[]).filter(a=>(S.cfg.add||[]).some(x=>x.id===a));
  const pos=f.pos&&Geo.ok(f.pos)?{lat:+f.pos.lat,lng:+f.pos.lng}:null;
  return{ok:true,v:{cid:c.id,data:f.data,hora,jan,sid:v.id,vid,cat,dur,preco,taxa,add,rec,obs:String(f.obs||'').trim(),end:String(f.end||'').trim(),pos}}},
 add(S,f,now){const r=Ag.val(S,f);if(!r.ok)return r;S.seq.ag=(S.seq.ag||0)+1;const id=Core.id();S.ag.push({id,num:S.seq.ag,...r.v,st:f.st==='confirmado'?'confirmado':'agendado',criado:now,ord:null,t:{},fotos:[]});return{ok:true,id}},
 edit(S,id,f){const a=S.ag.find(x=>x.id===id);if(!a)return err('Agendamento não encontrado.');if(!ATIVO.includes(a.st))return err('Este atendimento já foi encerrado.');const r=Ag.val(S,{...a,...f});if(!r.ok)return r;if(r.v.data!==a.data)a.ord=null;Object.assign(a,r.v);return{ok:true}},
 // choque com outro horário marcado (considera duração e a folga entre atendimentos)
 conflito(S,f,ignore){if(!f.hora)return null;const a0=D.m(f.hora),a1=a0+(+f.dur||60);
  return S.ag.find(a=>a.id!==ignore&&a.data===f.data&&ATIVO.includes(a.st)&&a.hora&&D.m(a.hora)<a1+(S.cfg.folga||0)&&a0<D.m(a.hora)+(a.dur||60)+(S.cfg.folga||0))||null},
 pos(S,a){if(a.pos&&Geo.ok(a.pos))return a.pos;const c=S.cli.find(x=>x.id===a.cid);return c&&Geo.ok(c)?{lat:c.lat,lng:c.lng}:null},
 end(S,a){if(a.end)return a.end;const c=S.cli.find(x=>x.id===a.cid);return c?c.end||'':''},
 dia(S,iso,todos){return S.ag.filter(a=>a.data===iso&&(todos||a.st!=='cancelado')).sort((a,b)=>(a.ord??1e9)-(b.ord??1e9)||(a.hora||'99').localeCompare(b.hora||'99')||a.criado-b.criado)},
 setSt(S,id,st,now){const a=S.ag.find(x=>x.id===id);if(!a)return err('Agendamento não encontrado.');if(!ST_AG[st]||st==='concluido')return err('Situação inválida.');
  if(!ATIVO.includes(a.st)&&!(st==='agendado'&&['cancelado','faltou'].includes(a.st)))return err('Este atendimento já foi encerrado.');
  a.st=st;a.t=a.t||{};a.t[st]=now;if(st==='andamento'&&!a.ini)a.ini=now;return{ok:true}},
 remarcar(S,id,data,hora,now){const a=S.ag.find(x=>x.id===id);if(!a)return err('Agendamento não encontrado.');if(a.st==='concluido')return err('Atendimento já concluído.');if(!D.okIso(data))return err('Data inválida.');if(hora&&!D.okHm(hora))return err('Hora inválida.');
  a.data=data;a.hora=hora||'';a.jan=hora?'fixa':(a.jan==='fixa'?'livre':a.jan);a.st='agendado';a.ord=null;a.ini=null;a.t={...(a.t||{}),remarcado:now||Date.now()};return{ok:true}},
 ordem(S,iso,ids){ids.forEach((id,i)=>{const a=S.ag.find(x=>x.id===id&&x.data===iso);if(a)a.ord=i});return{ok:true}},
 // conclui: registra a lavagem (baixa no estoque), liga ao agendamento e cria o próximo se for recorrente
 concluir(S,id,o,now){const a=S.ag.find(x=>x.id===id);if(!a)return err('Agendamento não encontrado.');if(!ATIVO.includes(a.st))return err('Este atendimento já foi encerrado.');
  const r=Core.reg(S,a.sid,o.sel||[],now,{cid:a.cid,vid:a.vid,vc:a.cat,pg:o.pg,preco:o.preco,taxa:o.taxa,dist:o.dist??null,dc:o.dc??null,et:o.et||[],fid:o.fid,agId:a.id,add:o.add||[],vist:o.vist||null,fotos:o.fotos||[],ini:a.ini||null,fim:now,semItens:true});
  if(!r.ok)return r;a.st='concluido';a.t=a.t||{};a.t.concluido=now;a.fim=now;a.lavId=r.id;let next=null;
  if(a.rec>0){const nd=D.add(a.data,a.rec);if(!S.ag.some(x=>x.cid===a.cid&&x.data===nd&&ATIVO.includes(x.st))){const q=Ag.add(S,{cid:a.cid,data:nd,hora:a.hora,jan:a.jan,sid:a.sid,vid:a.vid,cat:a.cat,dur:a.dur,preco:a.preco,taxa:a.taxa,add:a.add,rec:a.rec,obs:a.obs,end:a.end,pos:a.pos},now);if(q.ok)next=q.id}}
  return{ok:true,id:r.id,next}}
};

// ---------- o que levar no dia (soma do consumo por tipo de carro) ----------
const Kit={dia(S,ags){const m=new Map(),sem=new Set(),et=new Set();
 ags.filter(a=>ATIVO.includes(a.st)).forEach(a=>{const v=S.serv.find(x=>x.id===a.sid);if(!v)return;
  v.ids.forEach(pid=>{const p=S.prod.find(x=>x.id===pid);if(!p)return;const c=Core.consFor(p,a.cat);if(!(c>0)){sem.add(p.n);return}m.set(pid,(m.get(pid)||0)+c)});
  (v.et||[]).forEach(eid=>{const e=S.etp.find(x=>x.id===eid);if(e)et.add(e.n)})});
 const prods=[...m].map(([pid,need])=>{const p=S.prod.find(x=>x.id===pid);return{p,need:r3(need),tem:p.atual,falta:r3(Math.max(0,need-p.atual))}}).sort((a,b)=>b.falta-a.falta||a.p.n.localeCompare(b.p.n,'pt-BR'));
 return{prods,sem:[...sem],etp:[...et],falta:prods.filter(x=>x.falta>0)}}};

// ---------- calculadora de preço (serviço + adicionais + deslocamento; custo e lucro) ----------
const Calc={
 // arredonda a taxa para cima no múltiplo escolhido (R$ 1, R$ 5…): ninguém cobra R$ 0,48
 arred(S,x){const a=+(S.cfg.arred??1)||0;return a>0&&x>0?Math.ceil(x/a-1e-9)*a:x},
 preco(S,o){const v=S.serv.find(x=>x.id===o.sid),base0=v?Core.preco(S,v.id,o.cat):null,bx=o.base==null||String(o.base).trim()===''?null:num(o.base),base=bx!=null&&bx>=0?bx:base0;
  const adds=(o.add||[]).map(id=>(S.cfg.add||[]).find(x=>x.id===id)).filter(Boolean).map(a=>({id:a.id,n:a.n,valor:r2(a.t==='pct'?(base||0)*a.v/100:a.v)}));
  const d=S.desl,ida=Number.isFinite(o.ida)?o.ida:null,volta=ida==null?null:(Number.isFinite(o.volta)?o.volta:ida);let taxa=0,cd=0,km=null;
  if(ida!=null){km=ida+volta;cd=r2(km*(d.kmc||0));const g=+d.gratis||0,kt=Math.max(0,ida-g)+Math.max(0,volta-g);taxa=S.cfg.cobraTaxa===false||kt<=0?0:Calc.arred(S,r2(kt*(d.kmc||0)+(d.fixa||0)))}
  if(o.taxa!=null&&String(o.taxa).trim()!==''){const t=num(o.taxa);if(t>=0)taxa=t}
  const sub=r2((base||0)+adds.reduce((a,x)=>a+x.valor,0)),dp=num(o.descPct),desc=dp>0?r2(sub*Math.min(100,dp)/100):0,total=r2(sub-desc+taxa);
  const inf=v?Core.info(S,v,o.cat):null,cp=inf&&inf.custo!=null?r2(inf.custo):null,lucro=r2(total-(cp||0)-cd);
  return{base,adds,sub,desc,taxa,total,cp,cd,lucro,margem:total>0?lucro/total*100:null,km,ida,semPreco:base==null,semCusto:cp==null,
   fora:ida!=null&&d.raio>0&&ida>d.raio,acima:km!=null&&d.lim>0&&km>d.lim,aut:km!=null&&S.cfg.aut>0&&km>S.cfg.aut}}};

// ---------- clientes para chamar de novo (passaram do intervalo habitual) ----------
const Rec={chamar(S,iso){const by=new Map();S.lav.forEach(l=>{if(!l.cid)return;const a=by.get(l.cid);if(a)a.push(l.dt);else by.set(l.cid,[l.dt])});
 const fut=new Set(S.ag.filter(a=>ATIVO.includes(a.st)&&a.data>=iso).map(a=>a.cid)),out=[];
 S.cli.forEach(c=>{const L=by.get(c.id);if(!L||fut.has(c.id))return;
  const days=[...new Set(L.sort((a,b)=>a-b).map(t=>D.iso(t)))],gaps=days.slice(1).map((d,i)=>D.diff(days[i],d)).filter(g=>g>0).sort((a,b)=>a-b);
  const freq=c.freq>0?c.freq:(gaps.length?gaps[Math.floor(gaps.length/2)]:30),last=days[days.length-1],dias=D.diff(last,iso);
  if(dias>=freq)out.push({c,dias,freq,last,atraso:dias-freq,n:L.length})});
 return out.sort((a,b)=>b.atraso-a.atraso)}};

 L.forEach(l=>{const v=(l.preco||0)+(l.taxa||0);if(l.pago===false)pg.fiado+=v;else pg[l.pg||'']=(pg[l.pg||'']||0)+v});
 const h=L.filter(l=>l.ini&&l.fim&&l.fim-l.ini>=5*6e4&&l.fim-l.ini<=10*36e5).reduce((a,l)=>a+(l.fim-l.ini)/36e5,0),km=L.reduce((a,l)=>a+(l.dist>0?l.dist*2:0),0);
 return{L,...r,pg,horas:h,km,porHora:h>=0.25?r.fat/h:null,ticket:r.n?r.fat/r.n:null}},

// ---------- Pix estático "copia e cola" (padrão BR Code do Banco Central) ----------
// Cada campo = ID (2) + tamanho (2) + valor. O CRC16-CCITT (0x1021, início 0xFFFF) cobre tudo, inclusive "6304".
const Pix={
 tlv:(id,v)=>id+String(v.length).padStart(2,'0')+v,
 ascii:(t,max)=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7E]/g,'').trim().slice(0,max),
 crc(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let k=0;k<8;k++)c=c&0x8000?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')},
 // normaliza a chave conforme o tipo escolhido (11 dígitos soltos seriam lidos como CPF, por isso o tipo é explícito)
 chave(tipo,v){v=String(v||'').trim();if(tipo==='cpf'||tipo==='cnpj')return v.replace(/\D/g,'');if(tipo==='tel'){let d=v.replace(/\D/g,'');if(!d.startsWith('55')||d.length<12)d='55'+d;return '+'+d}return v.toLowerCase()},
 valida(tipo,v){const k=Pix.chave(tipo,v);if(!v)return err('Informe a chave Pix.');
  if(tipo==='cpf'&&k.length!==11)return err('CPF deve ter 11 números.');if(tipo==='cnpj'&&k.length!==14)return err('CNPJ deve ter 14 números.');
  if(tipo==='tel'&&!/^\+55\d{10,11}$/.test(k))return err('Telefone com DDD (10 ou 11 números).');if(tipo==='email'&&!/^\S+@\S+\.\S+$/.test(k))return err('E-mail inválido.');
  if(tipo==='aleatoria'&&!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(k))return err('Chave aleatória inválida (formato 0000…-…).');
  if(!['cpf','cnpj','tel','email','aleatoria'].includes(tipo))return err('Escolha o tipo da chave.');return{ok:true,k}},

 add(s,f,now){const v=num(f.valor);if(!(v>0))return err('Informe um valor maior que zero.');if(!DESP.some(d=>d[0]===f.cat))return err('Escolha a categoria.');

// ---------- backup online: só aceita a chave PUBLICÁVEL do Supabase ----------
// A chave secreta (sb_secret_… ou o JWT "service_role") ignora todas as regras de segurança do banco.
// Ela nunca pode ficar dentro de um app, então o app recusa.
const ChaveNuvem={
 b64(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return typeof atob==='function'?atob(s):''},
 confere(k){k=String(k||'').trim();if(!k)return err('Cole a chave publicável do projeto.');
  if(/^sb_secret_/.test(k))return err('Essa é a chave SECRETA. Nunca use ela no app: copie a chave publicável (sb_publishable_…).');
  if(/^sb_publishable_[\w-]{10,}$/.test(k))return{ok:true};
  if(/^eyJ[\w-]+\.[\w-]+\.[\w-]+$/.test(k)){let p=null;try{p=JSON.parse(ChaveNuvem.b64(k.split('.')[1]))}catch(e){}
   if(!p)return err('Chave inválida.');if(p.role==='service_role')return err('Essa é a chave "service_role" (secreta). Use a chave anon/publicável.');
   return p.role==='anon'?{ok:true}:err('Chave não reconhecida. Use a chave publicável.')}
  return err('Use a chave publicável (começa com sb_publishable_).')}
};

}

 else if(r.bad){BOOT.msg='Os dados salvos estavam danificados. Vamos tentar a cópia do banco interno.';try{BOOT.ruim=localStorage.getItem(KEY)}catch(e){}}

// banco interno do navegador (IndexedDB): bem mais espaço que o localStorage
const Banco={db:null,
 abrir(){return Banco.db?Promise.resolve(Banco.db):new Promise((ok,no)=>{if(!window.indexedDB)return no(new Error('sem IndexedDB'));const r=indexedDB.open('lavacao-db',2);
  r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('snap'))d.createObjectStore('snap')};
  r.onsuccess=()=>{Banco.db=r.result;ok(r.result)};r.onerror=()=>no(r.error);r.onblocked=()=>no(new Error('banco ocupado'))})},
 async op(st,mode,fn){const db=await Banco.abrir();return new Promise((ok,no)=>{const t=db.transaction(st,mode),o=t.objectStore(st);let out;const q=fn(o);if(q)q.onsuccess=()=>{out=q.result};t.oncomplete=()=>ok(out);t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)})},
 grava:(st,k,v)=>Banco.op(st,'readwrite',o=>o.put(v,k)),
 le:(st,k)=>Banco.op(st,'readonly',o=>o.get(k)).catch(()=>null),
 chaves:st=>Banco.op(st,'readonly',o=>o.getAllKeys()).catch(()=>[]),
 apaga:(st,k)=>Banco.op(st,'readwrite',o=>o.delete(k)).catch(()=>{})
};
const Dados={t:0,dia:'',
 agenda(){clearTimeout(Dados.t);Dados.t=setTimeout(Dados.espelhar,700)},
 // cópia do estado inteiro + uma cópia por dia (guarda as 7 mais recentes)
 async espelhar(){clearTimeout(Dados.t);try{const j=Core.exp(S);await Banco.grava('kv','estado',{t:Date.now(),rev:S.rev||0,j});
  const d=hoje();if(Dados.dia!==d&&!Core.vazio(S)){Dados.dia=d;await Banco.grava('snap',d,{t:Date.now(),j});const ks=(await Banco.chaves('snap')).map(String).sort().reverse();for(const k of ks.slice(7))await Banco.apaga('snap',k)}}catch(e){}},
 // libera espaço no localStorage (cópias da versão antiga, que agora ficam no banco interno)
 liberaLS(){try{Store.snaps(localStorage).forEach(k=>localStorage.removeItem(k));['lavacao-preimport','lavacao-prerestore','lavacao-prenuvem','lavacao-corrompido'].forEach(k=>localStorage.removeItem(k))}catch(e){}},
 async migra(){try{for(const k of Store.snaps(localStorage)){const j=localStorage.getItem(k);if(j)await Banco.grava('snap',k.slice(SNAP.length),{t:Date.now(),j});localStorage.removeItem(k)}if(BOOT.ruim)await Banco.grava('kv','corrompido',{t:Date.now(),j:BOOT.ruim})}catch(e){}},
 // guarda o que está aqui antes de substituir (importar, restaurar, baixar da nuvem)
 async antes(motivo){try{await Banco.grava('kv','antes',{t:Date.now(),motivo,j:Core.exp(S)})}catch(e){}},
 // ao abrir: se o banco interno tiver uma versão mais nova (ou o navegador apagou a principal), usa ela

  if(Versao.melhor(S,r.s)!=='b')return false;S=r.s;Store.save(localStorage,S);RT.dirty();if(!ui.sh)draw();toast('Seus dados foram recuperados do banco interno do aparelho.');return true},

};
// salvar: grava na hora (localStorage) e, logo depois, no banco interno; marca para o backup online
function save(){S.rev=(S.rev||0)+1;S.salvoEm=Date.now();let r=Store.save(localStorage,S);

 if(r.ok)Dados.agenda();else{Dados.espelhar();if(!ui.avisoLS){ui.avisoLS=1;toast('A memória rápida do navegador encheu. Seus dados seguem salvos no banco interno; faça um backup.',false)}}

// troca todos os dados de uma vez (importar backup, restaurar cópia, baixar da nuvem)

async function trocaDados(novo,msg){await Dados.antes(msg);const rv=Math.max(S.rev||0,novo.rev||0);S=novo;S.rev=rv;RT.P={};RT.Q={};save();Dados.espelhar();if(ui.sh)closeSheet();draw();if(msg)toast(msg)}

// APP · serviços: internet (rotas, endereços, clima), GPS, fotos, planejador do dia,

const Net={
 on:()=>navigator.onLine!==false,
 async j(url,ms=9000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{signal:c.signal,headers:{Accept:'application/json'}});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}},
 key:p=>p.lat.toFixed(4)+','+p.lng.toFixed(4),
 mem:{},
 cget(k,ttl){const m=Net.mem[k];if(m&&Date.now()-m.t<ttl)return m.v;return null},
 cset(k,v){Net.mem[k]={t:Date.now(),v};const ks=Object.keys(Net.mem);if(ks.length>80)delete Net.mem[ks[0]];return v},
 ll:pts=>pts.map(p=>p.lng.toFixed(6)+','+p.lat.toFixed(6)).join(';'),
 // rota pelas ruas (OSRM, servidor público e gratuito do OpenStreetMap)
 async route(pts){if(pts.length<2||!Net.on())return null;const k='r'+pts.map(Net.key).join(';'),c=Net.cget(k,20*6e4);if(c)return c;
  try{const j=await Net.j('https://router.project-osrm.org/route/v1/driving/'+Net.ll(pts)+'?overview=full&geometries=geojson&steps=false');if(j.code!=='Ok'||!j.routes||!j.routes[0])return null;
   const r=j.routes[0];return Net.cset(k,{legs:r.legs.map(l=>({km:l.distance/1000,min:l.duration/60})),geo:r.geometry.coordinates.map(c=>[c[1],c[0]]),km:r.distance/1000,min:r.duration/60})}catch(e){return null}},
 // matriz de tempos entre todos os pontos (para escolher a melhor ordem)
 async table(pts){if(pts.length<2||pts.length>25||!Net.on())return null;const k='t'+pts.map(Net.key).join(';'),c=Net.cget(k,20*6e4);if(c)return c;
  try{const j=await Net.j('https://router.project-osrm.org/table/v1/driving/'+Net.ll(pts)+'?annotations=duration,distance');if(j.code!=='Ok')return null;return Net.cset(k,{min:j.durations.map(r=>r.map(x=>x==null?null:x/60)),km:j.distances.map(r=>r.map(x=>x==null?null:x/1000))})}catch(e){return null}},
 // endereço → coordenadas (Nominatim/OpenStreetMap), priorizando a região da base
 async geocode(q,st){q=String(q||'').trim();if((!st&&q.length<4)||!Net.on())return[];const b=S.cfg.base,vb=b&&Geo.ok(b)?`&viewbox=${b.lng-.6},${b.lat+.6},${b.lng+.6},${b.lat-.6}`:'';
  const qs=st?Object.entries(st).filter(e=>e[1]).map(([k,v])=>'&'+k+'='+encodeURIComponent(v)).join(''):'&q='+encodeURIComponent(q);
  try{const j=await Net.j('https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=br&limit=6&accept-language=pt-BR&addressdetails=1'+vb+qs);
   return j.map(x=>({n:Net.nome(x),full:x.display_name,lat:+x.lat,lng:+x.lon,num:!!(x.address&&x.address.house_number)})).filter(Geo.ok)}catch(e){return null}},
 // CEP → rua, bairro e cidade (ViaCEP, gratuito)
 async cep(c){c=String(c||'').replace(/\D/g,'');if(c.length!==8||!Net.on())return null;try{const j=await Net.j('https://viacep.com.br/ws/'+c+'/json/');return j&&!j.erro?j:null}catch(e){return null}},
 // segunda fonte de endereços (Photon/Komoot), boa para digitar aos poucos
 async photon(q){const b=S.cfg.base,bias=b&&Geo.ok(b)?`&lat=${b.lat}&lon=${b.lng}`:'';try{const j=await Net.j('https://photon.komoot.io/api/?limit=6'+bias+'&q='+encodeURIComponent(q));
  return(j.features||[]).filter(f=>!f.properties.countrycode||f.properties.countrycode==='BR').map(f=>{const p=f.properties,[lng,lat]=f.geometry.coordinates,r=[p.street||p.name,p.housenumber].filter(Boolean).join(', ');return{n:[r,p.district||p.suburb,p.city].filter(Boolean).join(' · ')||p.name,full:[p.name!==p.street?p.name:'',p.postcode,p.state].filter(Boolean).join(' · '),lat,lng,num:!!p.housenumber}}).filter(Geo.ok)}catch(e){return null}},
 // busca combinada: CEP + número (ViaCEP), endereço estruturado e texto livre em duas fontes; número exato primeiro
 async busca(q){q=String(q||'').trim();if(q.length<3)return[];const p=Geo.parse(q);if(p)return[{n:'Coordenadas coladas',full:p.lat.toFixed(5)+', '+p.lng.toFixed(5),...p,num:true}];
  let q2=q,st=null,cepInfo=null;const m=q.match(/\b(\d{5})-?(\d{3})\b/);
  if(m){cepInfo=await Net.cep(m[1]+m[2]);if(cepInfo){const num=(q.replace(m[0],'').match(/\d+/)||[])[0]||'';q2=[cepInfo.logradouro+(num?', '+num:''),cepInfo.bairro,cepInfo.localidade,cepInfo.uf].filter(Boolean).join(', ');
   st={street:(num?num+' ':'')+cepInfo.logradouro,city:cepInfo.localidade,state:cepInfo.uf}}}
  else{const mm=q.match(/^(.+?),\s*(\d{1,6})\b(.*)$/);if(mm){const resto=mm[3].replace(/^[\s,-]+/,'').split(',').map(x=>x.trim()).filter(Boolean);st={street:mm[2]+' '+mm[1].trim(),city:resto[resto.length-1]||''};if(!st.city)st=null}}
  const[a,c,d]=await Promise.all([Net.geocode(q2),Net.photon(q2),st?Net.geocode('',st):Promise.resolve([])]);if(a===null&&c===null)return null;
  const out=[];[...(d||[]).filter(x=>x.num),...(c||[]).filter(x=>x.num),...(a||[]).filter(x=>x.num),...(d||[]),...(a||[]),...(c||[])].forEach(r=>{if(!out.some(o=>Geo.hav(o,r)<0.025))out.push(r)});

 fit(){const p=MAP.pts;if(!p.length||!MAP.m)return;const[t,r,b,l]=MAP.pad;if(p.length===1)MAP.m.setView(p[0],15);else MAP.m.fitBounds(p,{paddingTopLeft:[l,t],paddingBottomRight:[r,b],maxZoom:16})},

 draw(P,iso){if(!MAP.m)return;MAP.lay.clearLayers();const pts=[],b=RT.base(),nx=iso===hoje()?nextAtivo():null;
  if(b){L.marker([b.lat,b.lng],{icon:pinIcon(`<div class="mkb">${ico('home')}</div>`,[30,30],[15,15]),title:'Base',zIndexOffset:-100}).addTo(MAP.lay);pts.push([b.lat,b.lng])}
  Ag.dia(S,iso||hoje()).filter(a=>a.st==='concluido').forEach(a=>{const p=Ag.pos(S,a);if(p)L.marker([p.lat,p.lng],{icon:pinIcon(`<div class="mkd">${ico('check')}</div>`,[24,24],[12,12]),title:'Feito'}).addTo(MAP.lay)});
  if(P&&P.ag){const line=P.geo&&P.geo.length?P.geo:[P.start&&P.start.pos?[P.start.pos.lat,P.start.pos.lng]:null,...P.ag.map(a=>{const p=Ag.pos(S,a);return p?[p.lat,p.lng]:null}),P.back&&b?[b.lat,b.lng]:null].filter(Boolean);
   if(line.length>1){L.polyline(line,{color:'#fff',weight:9,opacity:.9,lineCap:'round',lineJoin:'round'}).addTo(MAP.lay);L.polyline(line,{color:'#2563eb',weight:5,opacity:.95,lineCap:'round',lineJoin:'round',dashArray:P.net?null:'2 10'}).addTo(MAP.lay)}
   P.ag.forEach((a,i)=>{const p=Ag.pos(S,a);if(!p)return;const c=cliOf(a.cid),cur=nx&&nx.id===a.id;
    L.marker([p.lat,p.lng],{icon:pinIcon(`<div class="mk${cur?' cur':''}" style="background:${SCOL[a.st]}"><span>${i+1}</span></div>`,cur?[40,40]:[34,34],cur?[20,46]:[17,40]),title:c?c.n:'',zIndexOffset:cur?500:0}).addTo(MAP.lay).on('click',()=>openSheet('at',{id:a.id}));pts.push([p.lat,p.lng])})}
  MAP.me();const g=GPS.fresh();if(g)pts.push([g.lat,g.lng]);
  MAP.pts=pts;const sig=JSON.stringify(pts.map(x=>x.map(v=>v.toFixed(3))));if(pts.length&&sig!==MAP.sig){MAP.sig=sig;MAP.fit()}},
 me(){if(!MAP.m)return;const g=GPS.fresh();if(!g){if(MAP.meM){MAP.meM.remove();MAP.meM=null}if(MAP.accC){MAP.accC.remove();MAP.accC=null}return}
  if(!MAP.meM)MAP.meM=L.marker([g.lat,g.lng],{icon:pinIcon('<div class="me"></div>',[20,20],[10,10]),zIndexOffset:1000,interactive:false}).addTo(MAP.m);else MAP.meM.setLatLng([g.lat,g.lng]);
  if(GPS.acc&&GPS.acc<300){if(!MAP.accC)MAP.accC=L.circle([g.lat,g.lng],{radius:GPS.acc,color:'#2563eb',weight:1,fillOpacity:.08,interactive:false}).addTo(MAP.m);else MAP.accC.setLatLng([g.lat,g.lng]).setRadius(GPS.acc)}},
 centrar(){const g=GPS.fresh();if(g&&MAP.m)MAP.m.flyTo([g.lat,g.lng],16,{duration:.6});else{GPS.start();toast('Procurando sua localização…')}}
};

// ---------- Pix: QR Code e "copia e cola" com o valor ----------
const pixOk=()=>!!(S.cfg.pixTipo&&S.cfg.pixChave&&Pix.valida(S.cfg.pixTipo,S.cfg.pixChave).ok);
const pixCod=v=>Pix.payload({tipo:S.cfg.pixTipo,chave:S.cfg.pixChave,nome:S.cfg.pixNome||S.marca||S.cfg.nome||'Lavacao',cidade:S.cfg.pixCidade||'BRASIL',valor:+v||0});
const pixTxt=v=>pixOk()?`\nPix (copia e cola): ${pixCod(v)}`:(S.cfg.pix?` Pix: ${S.cfg.pix}.`:'');
function qrSvg(t){if(typeof qrcodegen==='undefined')return '';const q=qrcodegen.QrCode.encodeText(t,qrcodegen.QrCode.Ecc.MEDIUM),n=q.size,b=2;let d='';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.getModule(x,y))d+=`M${x+b},${y+b}h1v1h-1z`;
 return `<svg viewBox="0 0 ${n+2*b} ${n+2*b}" shape-rendering="crispEdges" role="img" aria-label="QR Code Pix"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`}
function pixBloco(valor,cid){valor=+valor||0;if(!pixOk())return `<button class="alert info" onclick="closeSheet();ui.aj='neg';go('ajustes')">${ico('cash')}<div><b>Mostrar QR Code Pix aqui</b><span>Cadastre sua chave Pix em Ajustes → Seu negócio.</span></div></button>`;
 const c=pixCod(valor),cl=cliOf(cid);return `<div class="pixb"><div class="qr">${qrSvg(c)}</div><div class="tx"><b>Pix de ${R(valor)}</b><p class="xs mut">O cliente aponta a câmera do app do banco. Confira o recebimento no seu banco.</p><div class="pixcc">${esc(c)}</div>
 <div class="row"><button class="btn sm" onclick="copiar(pixCod(${valor}),'Pix copia e cola copiado')">${ico('copy')}Copiar</button>${cl&&cl.tel?`<button class="btn sm wa" onclick="pixEnviar(${valor},'${cid}')">${ico('msg')}Enviar</button>`:''}</div></div></div>`}
function pixEnviar(v,cid){const c=cliOf(cid);if(c)wa(c.tel,'Oi '+first(c.n)+'! Segue o Pix de '+R(v)+' (copia e cola):\n'+pixCod(v))}

const fotosHtml=(F,agId)=>`<div class="photos">${F.map(x=>`<img data-foto="${x.id}" alt="foto ${x.k==='depois'?'depois':'antes'}" onclick="verFoto('${x.id}')">`).join('')}<label class="add" aria-label="Tirar foto">${ico('cam')}<input type="file" accept="image/*" capture="environment" hidden onchange="addFoto('${agId}',this)"></label></div>`;
async function addFoto(id,inp){const f=inp.files&&inp.files[0];if(!f)return;try{const a=agById(id),k=a.st==='andamento'&&ui.sh&&ui.sh.fase==='fim'?'depois':'antes',c=cliOf(a.cid)||{};
 const b=await Fotos.shrink(f,(k==='antes'?'Antes':'Depois')+' · '+first(c.n)),fid=await Fotos.put(b);a.fotos=(a.fotos||[]).concat([{id:fid,k,t:Date.now()}]);save();if(ui.sh)renderSheet();Fotos.paint();toast('Foto salva com data e hora')}catch(e){toast('Não foi possível salvar a foto: '+e.message,false)}}
// visualizador em tela cheia (funciona por cima de qualquer janela)
async function verFoto(id){const u=await Fotos.url(id);if(!u)return toast('Foto indisponível.',false);const v=document.createElement('div');v.className='viewer';v.setAttribute('role','dialog');v.setAttribute('aria-label','Foto');
 v.innerHTML=`<img src="${u}" alt="foto"><div class="vbar"><button class="btn" data-a="share">${ico('send')}Enviar</button><button class="btn" data-a="x">${ico('x')}Fechar</button></div>`;
 v.onclick=e=>{const b=e.target.closest('button');if(b&&b.dataset.a==='share'){enviarFotos([{id,k:'foto'}],'');return}v.remove()};document.body.appendChild(v)}
async function enviarFotos(lista,texto){try{const files=[];for(const x of lista){const b=await Fotos.get(x.id);if(b)files.push(new File([b],`${x.k||'foto'}-${files.length+1}.jpg`,{type:'image/jpeg'}))}
 if(!files.length)return toast('Nenhuma foto encontrada.',false);if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files,text:texto});return}
 toast('Este navegador não envia fotos direto. Toque e segure a foto para salvar.',false)}catch(e){if(e.name!=='AbortError')toast('Não foi possível enviar: '+e.message,false)}}

const PASSOS=['Ir','Chegar','Lavar','Receber'];
const passoDe=a=>a.st==='caminho'?1:a.st==='andamento'?2:a.st==='concluido'?4:0;

RENDER.hoje=()=>{const iso=hoje(),all=Ag.dia(S,iso),act=all.filter(a=>ATIVO.includes(a.st)),dn=all.filter(a=>a.st==='concluido'),P=RT.dia(iso),lv=S.lav.filter(l=>D.iso(l.dt)===iso),rs=Core.resumo(lv),prev=act.reduce((s,a)=>s+valorAg(a),0),nx=nextAtivo();
 const ordem=[...dn,...P.ag.filter(a=>act.includes(a))];
 // coluna 1: resumo do dia + o que fazer agora

 ${ordem.length?`<div class="dots">${ordem.map(a=>`<button class="${a.st==='concluido'?'ok':nx&&a.id===nx.id?'on':''}" onclick="openSheet('at',{id:'${a.id}'})" aria-label="${esc((cliOf(a.cid)||{}).n)}">${a.st==='concluido'?ico('check'):esc(ini((cliOf(a.cid)||{}).n))}</button>`).join('<i></i>')}</div>`:''}

 const ab=Cx.aberto(S);if(ab.length)al('','wallet',R(ab.reduce((s,l)=>s+(l.preco||0)+(l.taxa||0),0))+' a receber (fiado)',ab.length+(ab.length===1?' lavagem em aberto':' lavagens em aberto'),"ui.per='mes';go('caixa')");
 const rc=Rec.chamar(S,iso);if(rc.length)al('info','users',rc.length+(rc.length===1?' cliente no tempo de lavar':' clientes no tempo de lavar'),rc.slice(0,3).map(r=>esc(first(r.c.n))+' ('+r.dias+' dias)').join(', ')+' · chame pelo WhatsApp.',"ui.cf='chamar';go('cli')");
 const bx=S.prod.filter(p=>Core.st(S,p)!=='normal');if(bx.length)al('','cart',bx.length+(bx.length===1?' produto para repor':' produtos para repor'),bx.map(p=>esc(p.n)).join(', '),"ui.et='comp';go('est')");
 if(ui.avisoLS)al('bad','alert','Memória do navegador cheia','Os dados estão no banco interno. Baixe um backup e ligue o backup online.',"ui.aj='dados';go('ajustes')");
 if(NV.st==='conflito')al('bad','cloudup','Backup online: outro aparelho salvou depois','Escolha qual versão fica.',"openSheet('nuvem')");else if(NV.st==='erro')al('','cloudup','Backup online com problema',esc(NV.err),"openSheet('nuvem')");else if(!NV.on()&&S.lav.length>=3&&(!S.bkAt||Date.now()-S.bkAt>14*864e5))al('info','cloudup','Proteja seus dados','Ligue o backup online: se perder o celular, nada se perde.',"ui.aj='seg';go('ajustes')");

 return `<details class="card pend" ${urg||ui.pendOpen?'open':''} ontoggle="ui.pendOpen=this.open"><summary>${ico('alert')}Avisos <span class="cnt${urg?' bad':''}">${out.length}</span></summary>${out.map(o=>o.h).join('')}</details>`}

   const tx=await r.text();let j=null;try{j=tx?JSON.parse(tx):null}catch(e){}if(!r.ok){const m=(j&&(j.msg||j.message||j.error_description||j.error))||('HTTP '+r.status);const e=new Error(NV.msg(m));e.status=r.status;throw e}return j}
  catch(e){if(e.name==='AbortError'||/Failed to fetch|NetworkError|Load failed/.test(e.message))throw new Error('Sem conexão com o banco online.');throw e}finally{clearTimeout(t)}},
 msg(m){m=String(m);return /Invalid login/i.test(m)?'E-mail ou senha incorretos.':/already registered/i.test(m)?'Este e-mail já tem conta. Use "Entrar".':/Email not confirmed/i.test(m)?'Confirme o e-mail (ou desligue "Confirm email" no Supabase).':/at least 6|Password should/i.test(m)?'A senha precisa ter pelo menos 6 caracteres.':/salvar_backup|lavacao_backup|schema cache|does not exist/i.test(m)?'O banco ainda não foi preparado: rode o arquivo lavacao-nuvem.sql no Supabase.':/Invalid API key|No API key/i.test(m)?'Chave do projeto inválida.':m},
 async login(email,pw,criar){const c=NV.c;const j=await NV.f(criar?'/auth/v1/signup':'/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password:pw})},c.key);
  if(!j||!j.access_token)throw new Error(criar?'Conta criada, mas o Supabase pediu confirmação de e-mail. Desligue "Confirm email" em Authentication → Providers → Email, ou confirme e depois toque em Entrar.':'Não foi possível entrar.');
  Object.assign(c,{email,at:j.access_token,rt:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000,uid:(j.user||{}).id});NV.gravar();return true},
 async tok(){const c=NV.c;if(c.at&&Date.now()<c.exp-60000)return c.at;const j=await NV.f('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:c.rt})},c.key);
  if(!j||!j.access_token){c.rt=null;NV.gravar();throw new Error('Sessão expirada. Entre de novo.')}Object.assign(c,{at:j.access_token,rt:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000});NV.gravar();return c.at},
 async remoto(){const t=await NV.tok(),r=await NV.f('/rest/v1/lavacao_backup?select=versao,aparelho,atualizado,data',{},t);return r&&r[0]||null},
 async enviar(forcar,keep){if(!NV.on())return;const c=NV.c,t=await NV.tok();NV.st='enviando';NV.pinta();
  const r=await NV.f('/rest/v1/rpc/salvar_backup',{method:'POST',keepalive:keep,body:JSON.stringify({p_data:JSON.parse(Core.exp(S)),p_base:forcar?null:(c.versao??null),p_aparelho:NV.aparelho()})},t);
  if(r&&r.conflito){NV.st='conflito';c.remoto={versao:r.versao,aparelho:r.aparelho,atualizado:r.atualizado};NV.gravar();NV.pinta();return r}
  c.versao=r.versao;c.ult=Date.now();c.sujo=0;c.remoto=null;NV.st='ok';NV.err='';NV.gravar();NV.pinta();return r},
 sujo(){if(!NV.on())return;NV.c.sujo=1;NV.gravar();clearTimeout(NV.t);NV.t=setTimeout(()=>NV.auto(),12000)},
 async auto(){if(!NV.on()||!NV.c.sujo||NV.st==='conflito')return;try{await NV.enviar()}catch(e){NV.st='erro';NV.err=e.message;NV.pinta();clearTimeout(NV.t);NV.t=setTimeout(()=>NV.auto(),60000)}},
 // usa a versão da nuvem (guarda antes uma cópia do que está aqui)
 async baixar(r){r=r||await NV.remoto();if(!r)throw new Error('Ainda não há backup na nuvem.');const x=Core.imp(JSON.stringify(r.data));if(!x.ok)throw new Error(x.e);
  await Dados.antes('nuvem');const rv=Math.max(S.rev||0,x.s.rev||0);S=x.s;S.rev=rv+1;Store.save(localStorage,S);Dados.espelhar();
  NV.c.versao=r.versao;NV.c.sujo=0;NV.c.remoto=null;NV.c.ult=Date.now();NV.st='ok';NV.gravar();RT.P={};RT.Q={};RT.dirty();draw()},
 async hist(){const t=await NV.tok();return await NV.f('/rest/v1/lavacao_hist?select=id,versao,aparelho,criado&order=criado.desc&limit=20',{},t)||[]},
 async histDados(id){const t=await NV.tok(),r=await NV.f('/rest/v1/lavacao_hist?select=versao,data&id=eq.'+(+id),{},t);return r&&r[0]},
 sair(){if(!NV.c)return;NV.c.at=null;NV.c.rt=null;NV.c.versao=null;NV.gravar();NV.st=''},
 pinta(){const e=$('nvst');if(e)e.innerHTML=NV.rotulo()},
 rotulo(){if(!NV.on())return'<span class="mut">Desligado</span>';const c=NV.c;return NV.st==='enviando'?'Enviando…':NV.st==='conflito'?'<span class="warn">Outro aparelho salvou depois</span>':NV.st==='erro'?`<span class="bad">${esc(NV.err)}</span>`:c.sujo?'<span class="warn">Alterações a enviar</span>':c.ult?'<span class="ok">Salvo '+ago(c.ult)+' · '+new Date(c.ult).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'</span>':'<span class="ok">Conectado</span>'}
};
NV.load();
Vida.sair.push(()=>{if(NV.on()&&NV.c.sujo&&NV.c.at&&Date.now()<NV.c.exp)NV.enviar(false,true).catch(()=>{})});
SHEETS.nuvem=()=>{const f=ui.f,c=NV.c||{};if(!f._i){f._i=1;f.url=c.url||'';f.key=c.key||'';f.email=c.email||''}
 if(NV.on())return shHead('Backup online',esc(c.email||''))+`<div class="card flat tight"><div class="kv"><span>Situação</span><b id="nvst">${NV.rotulo()}</b></div><div class="kv"><span>Versão na nuvem</span><b>${c.versao??'—'}</b></div><div class="kv"><span>Este aparelho</span><b>${esc(NV.aparelho())}</b></div></div>
  ${NV.st==='conflito'||c.remoto?`<div class="alert static">${ico('alert')}<div><b>Outro aparelho salvou depois</b><span>${esc((c.remoto||{}).aparelho||'')}${c.remoto&&c.remoto.atualizado?' · '+new Date(c.remoto.atualizado).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):''}. Escolha qual fica.</span></div></div>
  <div class="row"><button class="btn p" onclick="nvBaixar(this)">Usar o da nuvem</button><button class="btn" onclick="twice('nvf',()=>nvEnviar(1))">${armed('nvf','Manter o deste','Confirmar?')}</button></div>`:`<button class="btn p w" onclick="nvEnviar()">${ico('refresh')}Salvar agora</button>`}
  <details class="card flat" style="margin-top:12px" ontoggle="if(this.open)nvHist()"><summary>${ico('clock')}Pontos de restauração</summary><div id="nvh"><p class="mut sm">Carregando…</p></div></details>
  <button class="btn w" style="margin-top:8px" onclick="NV.sair();renderSheet();draw();toast('Desconectado da nuvem')">Sair da conta</button>
  <p class="xs mut" style="margin-top:10px">Salva sozinho alguns segundos depois de cada mudança e guarda um ponto de restauração a cada 6 horas (os 40 mais recentes). Fotos ficam só no aparelho.</p>`;
 return shHead('Backup online','Seus dados guardados no seu Supabase, com senha')+`<p class="sm mut" style="margin-bottom:12px">1) Rode o arquivo <b>lavacao-nuvem.sql</b> no SQL Editor do Supabase. 2) Cole abaixo o endereço do projeto e a chave publicável (Project Settings → API Keys). 3) Crie sua conta.</p>
 <label class="f"><span>Endereço do projeto</span><input value="${esc(f.url)}" placeholder="https://xxxx.supabase.co" oninput="ui.f.url=this.value.trim()" autocapitalize="off"></label>
 <label class="f"><span>Chave publicável</span><input value="${esc(f.key)}" placeholder="sb_publishable_…" oninput="ui.f.key=this.value.trim()" autocapitalize="off"></label>
 <div class="inl"><label class="f"><span>Seu e-mail</span><input type="email" value="${esc(f.email)}" oninput="ui.f.email=this.value.trim()" autocomplete="username" autocapitalize="off"></label><label class="f"><span>Senha</span><input id="nvpw" type="password" autocomplete="current-password"></label></div>
 <p class="err" id="sherr"></p><div class="row"><button class="btn p" onclick="nvEntrar(this,0)">Entrar</button><button class="btn" onclick="nvEntrar(this,1)">Criar conta</button></div>
 <p class="xs mut" style="margin-top:10px">Nunca cole a chave "secret" ou "service_role": o app recusa. A chave publicável é feita para ficar no app; quem protege os dados é a sua senha e as regras do banco.</p>`};
async function nvEntrar(b,criar){const f=ui.f,pw=$('nvpw').value;if(!/^https:\/\/[\w-]+\.supabase\.co\/?$/.test(f.url))return shErr('Endereço inválido. Ex.: https://xxxx.supabase.co');const ck=ChaveNuvem.confere(f.key);if(!ck.ok)return shErr(ck.e);if(!/^\S+@\S+\.\S+$/.test(f.email))return shErr('E-mail inválido.');if(pw.length<6)return shErr('A senha precisa ter pelo menos 6 caracteres.');
 b.disabled=true;NV.c={url:f.url.replace(/\/$/,''),key:f.key};try{await NV.login(f.email,pw,criar);const r=await NV.remoto();
  if(r&&r.data){NV.c.remoto={versao:r.versao,aparelho:r.aparelho,atualizado:r.atualizado};NV.c.versao=null;NV.st='conflito';NV.gravar();renderSheet();toast('Já existe um backup na nuvem. Escolha qual fica.')}
  else{await NV.enviar(1);renderSheet();toast('Backup online ligado')}draw()}catch(e){NV.c=null;NV.gravar();b.disabled=false;shErr(e.message)}}
async function nvEnviar(forcar){try{await NV.enviar(!!forcar);toast('Salvo na nuvem');if(ui.sh&&ui.sh.t==='nuvem')renderSheet()}catch(e){toast(e.message,false)}}
async function nvBaixar(b){if(b)b.disabled=true;try{await NV.baixar();toast('Dados da nuvem carregados');if(ui.sh)renderSheet()}catch(e){toast(e.message,false);if(b)b.disabled=false}}
async function nvHist(){const el=$('nvh');try{const L=await NV.hist();if(!el)return;el.innerHTML=L.length?L.map(h=>`<div class="kv"><span>${new Date(h.criado).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})} · ${esc(h.aparelho||'')}</span><button class="lnk" onclick="twice('h${+h.id}',()=>nvRestH(${+h.id}));nvHist()">${armed('h'+(+h.id),'Restaurar','Confirmar?')}</button></div>`).join(''):'<p class="mut sm">Ainda não há pontos de restauração.</p>'}catch(e){if(el)el.innerHTML=`<p class="bad sm">${esc(e.message)}</p>`}}
async function nvRestH(id){try{const r=await NV.histDados(id);if(!r)throw new Error('Ponto não encontrado.');const x=Core.imp(JSON.stringify(r.data));if(!x.ok)throw new Error(x.e);await trocaDados(x.s,'Ponto de restauração aplicado');await NV.enviar(1)}catch(e){toast(e.message,false)}}

(function(){const v=(location.hash.match(/^#\/(\w+)/)||[])[1];if(VIEWS[v])ui.v=v;history.replaceState(null,'','#/'+ui.v)})();
draw();
PIN.trava();
swInit();
if(BOOT.msg)toast(BOOT.msg,false);

(async()=>{await Dados.migra();const rec=await Dados.confere();
 if(!rec&&Core.vazio(S)&&!S.serv.length){Core.addServ(S,'Lavagem completa');save();if(!ui.sh)draw()}else Dados.espelhar();
 if(instalado()||!Core.vazio(S))Arm.proteger()})();
nvCheck();
GPS.check().then(st=>{if(st==='granted'&&RT.ativos(hoje()).length)GPS.start()});
WX.load().then(d=>{if(d&&!ui.sh)draw()});

addEventListener('storage',e=>{if(e.key!==KEY||!e.newValue)return;const r=Core.imp(e.newValue);if(r.ok&&(r.s.rev||0)>(S.rev||0)){S=r.s;RT.dirty();if(!ui.sh)draw()}});
// backup online: se outro aparelho salvou depois e aqui não há nada pendente, atualiza sozinho
async function nvCheck(){if(!NV.on())return;try{const r=await NV.remoto();if(!r)return NV.enviar(1);
 if(NV.c.versao==null||r.versao>NV.c.versao){if(!NV.c.sujo&&NV.c.versao!=null){await NV.baixar(r);toast('Dados atualizados com o que foi salvo em '+(r.aparelho||'outro aparelho'))}else{NV.st='conflito';NV.c.remoto={versao:r.versao,aparelho:r.aparelho,atualizado:r.atualizado};NV.gravar();if(!ui.sh)draw()}}
 else if(NV.c.sujo)NV.auto()}catch(e){NV.st='erro';NV.err=e.message}}
